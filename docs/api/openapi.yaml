      description: Immediately invalidates the project key and every already-issued MCP access token naming this credential, regardless of the token's remaining lifetime. Each MCP request rechecks authoritative credential state before quota consumption or dispatch.
      tags: [Integrations]
      operationId: revokeIntegrationCredential
      security: [{ sellerBearer: [] }]
      parameters:
        - { $ref: '#/components/parameters/SellerId' }
        - { $ref: '#/components/parameters/CredentialId' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expectedVersion]
              properties:
                expectedVersion: { type: integer, minimum: 1 }
      responses:
        '200':
          description: Revoked credential metadata
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IntegrationCredential' }
