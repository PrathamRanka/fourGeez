openapi: 3.1.0
info:
  title: AgentPay API
  version: 0.3.4
  description: Seller commerce gateway, approval, transaction, and dispute API. AgentPay is a working name.
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
  - url: https://{apiHost}
    description: Environment-specific API Gateway origin
    variables:
      apiHost:
        default: api.agentpay.invalid
        description: Replace with the deployed API Gateway custom domain.
tags:
  - name: Sellers
    description: Seller onboarding, route configuration, and transaction views.
  - name: Integrations
    description: Seller-scoped credentials used by MCP and coding-agent integrations.
  - name: Settlement
    description: Seller payment destinations and reconciliation configuration.
  - name: Storefront
    description: Public machine-readable discovery documents.
  - name: Intents
    description: Immutable purchase proposals evaluated before payment.
  - name: Approvals
    description: Threshold-triggered multi-party authorization.
  - name: Transactions
    description: Payment, delivery, and evidence status.
  - name: Billing
    description: Seller plans, entitlements, usage, and invoice exports.
  - name: Disputes
    description: Deterministic dispute classification and review.
  - name: Proxy
    description: x402-protected forwarding to configured seller APIs.
paths:
  /health:
    get:
      summary: Check service health
      operationId: getHealth
      security: []
      responses:
        '200':
          description: Service is running
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, const: ok }
        '503':
          description: A required dependency is unavailable
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429':
          description: Health endpoint rate limit exceeded
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /v1/sellers:
    post:
      summary: Create a seller storefront
      tags: [Sellers]
      operationId: createSeller
      security: [{ sellerBearer: [] }]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateSellerRequest' }
      responses:
        '201': { $ref: '#/components/responses/SellerCreated' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
  /v1/plans:
    get:
      summary: List versioned seller plans and operational entitlements
      tags: [Billing]
      operationId: listSellerPlans
      security: []
      responses:
        '200':
          description: Immutable V1 seller plan catalog
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/PlanDefinition' }
        '429':
          description: Plan catalog rate limit exceeded
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /v1/sellers/{sellerId}/plan:
    get:
      summary: Get the authenticated seller plan assignment
      tags: [Billing]
      operationId: getSellerPlan
      security: [{ sellerBearer: [] }]
      parameters:
        - { $ref: '#/components/parameters/SellerId' }
      responses:
        '200':
          description: Seller assignment and immutable plan definition
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SellerPlanResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/sellers/{sellerId}/routes:
    post:
      summary: Add a paid route to a seller
      tags: [Sellers]
      operationId: createPaidRoute
      security: [{ sellerBearer: [] }]
      parameters:
        - { $ref: '#/components/parameters/SellerId' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateRouteRequest' }
      responses:
        '201':
          description: Route created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaidRoute' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /v1/sellers/{sellerId}/payment-destinations:
    get:
      summary: List seller payment destinations
      tags: [Sellers, Settlement]
      operationId: listPaymentDestinations
      security: [{ sellerBearer: [] }]
      parameters:
        - { $ref: '#/components/parameters/SellerId' }
      responses:
        '200':
          description: Seller payment destinations
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/PaymentDestination' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      summary: Create a pending seller payment destination
      tags: [Sellers, Settlement]
      operationId: createPaymentDestination
      security: [{ sellerBearer: [] }]
      parameters:
        - { $ref: '#/components/parameters/SellerId' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreatePaymentDestinationRequest' }
      responses:
        '201':
          description: Pending payment destination created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaymentDestination' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /v1/sellers/{sellerId}/payment-destinations/{destinationId}:
    get:
      summary: Get one seller payment destination
      tags: [Sellers, Settlement]
      operationId: getPaymentDestination
      security: [{ sellerBearer: [] }]
      parameters:
        - { $ref: '#/components/parameters/SellerId' }
        - { $ref: '#/components/parameters/DestinationId' }
      responses:
        '200':
          description: Seller payment destination
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaymentDestination' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/sellers/{sellerId}/payment-destinations/{destinationId}/ownership-challenges:
    post:
      summary: Create a one-time payment-destination ownership challenge
      description: The raw challenge is returned in this response and is not persisted by the settlement repository.
      tags: [Sellers, Settlement]
      operationId: createPaymentDestinationChallenge
      security: [{ sellerBearer: [] }]
      parameters:
        - { $ref: '#/components/parameters/SellerId' }
        - { $ref: '#/components/parameters/DestinationId' }
      responses:
        '201':
          description: One-time ownership challenge
          headers:
            Cache-Control: { schema: { type: string, const: no-store } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OwnershipChallenge' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /v1/sellers/{sellerId}/payment-destinations/{destinationId}/verify:
    post:
      summary: Verify ownership and activate a payment destination
      description: Uses an EIP-191 personal-sign proof for eip155 networks and requires explicit confirmation when replacing an active destination.
      tags: [Sellers, Settlement]
      operationId: verifyPaymentDestination
      security: [{ sellerBearer: [] }]
      parameters:
        - { $ref: '#/components/parameters/SellerId' }
        - { $ref: '#/components/parameters/DestinationId' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VerifyPaymentDestinationRequest' }
      responses:
        '200':
          description: Verified active payment destination
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaymentDestination' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '410': { $ref: '#/components/responses/Gone' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /v1/sellers/{sellerId}/webhook-subscriptions:
    get:
      summary: List seller webhook subscriptions
      tags: [Sellers]
      operationId: listWebhookSubscriptions
      security: [{ sellerBearer: [] }]
      parameters:
        - { $ref: '#/components/parameters/SellerId' }
      responses:
        '200':
          description: Redacted webhook subscriptions
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/WebhookSubscription' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      summary: Create a seller webhook subscription
      tags: [Sellers]
      operationId: createWebhookSubscription
      security: [{ sellerBearer: [] }]
      parameters:
        - { $ref: '#/components/parameters/SellerId' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateWebhookSubscriptionRequest' }
      responses:
        '201':
          description: Subscription metadata and the signing secret returned once
          headers:
            Cache-Control: { schema: { type: string, const: no-store } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WebhookSubscriptionCreated' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /v1/sellers/{sellerId}/webhook-deliveries:
    get:
      summary: List seller webhook delivery history
      tags: [Sellers]
      operationId: listWebhookDeliveries
      security: [{ sellerBearer: [] }]
      parameters:
        - { $ref: '#/components/parameters/SellerId' }
        - { $ref: '#/components/parameters/DeliveryLimit' }
        - { $ref: '#/components/parameters/DeliveryCursor' }
      responses:
        '200':
          description: Bounded newest-first webhook delivery history
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/WebhookDelivery' }
                  nextCursor: { type: [string, 'null'] }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/sellers/{sellerId}/webhook-deliveries/{deliveryId}/redeliver:
    post:
      summary: Redeliver one dead-letter webhook with its original event identity
      tags: [Sellers]
      operationId: redeliverWebhookDelivery
      security: [{ sellerBearer: [] }]
      parameters:
        - { $ref: '#/components/parameters/SellerId' }
        - { $ref: '#/components/parameters/DeliveryId' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      responses:
        '200':
          description: Delivery scheduled for immediate retry
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WebhookDelivery' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /v1/sellers/{sellerId}/integration-credentials:
    get:
      summary: List redacted seller integration credentials
      tags: [Integrations]
      operationId: listIntegrationCredentials
      security: [{ sellerBearer: [] }]
      parameters:
        - { $ref: '#/components/parameters/SellerId' }
      responses:
        '200':
          description: Seller integration credentials without token hashes or raw tokens
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/IntegrationCredential' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      summary: Create a seller-scoped integration credential
      tags: [Integrations]
      operationId: createIntegrationCredential
      security: [{ sellerBearer: [] }]
      parameters:
        - { $ref: '#/components/parameters/SellerId' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateIntegrationCredentialRequest' }
      responses:
        '201':
          description: Credential metadata and the raw token returned once
          headers:
            Cache-Control: { schema: { type: string, const: no-store } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IntegrationCredentialCreated' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /v1/sellers/{sellerId}/integration-credentials/{credentialId}/revoke:
    post:
      summary: Revoke a seller integration credential
      tags: [Integrations]
      operationId: revokeIntegrationCredential
      security: [{ sellerBearer: [] }]
      parameters:
        - { $ref: '#/components/parameters/SellerId' }
        - { $ref: '#/components/parameters/CredentialId' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expectedVersion]
              properties:
                expectedVersion: { type: integer, minimum: 1 }
      responses:
        '200':
          description: Revoked credential metadata
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IntegrationCredential' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /v1/sellers/{sellerId}/routes/{routeId}:
    patch:
      summary: Update the price used by future purchase intents
      tags: [Sellers]
      operationId: updatePaidRoutePrice
      security: [{ sellerBearer: [] }]
      parameters:
        - { $ref: '#/components/parameters/SellerId' }
        - { $ref: '#/components/parameters/RouteId' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateRoutePriceRequest' }
      responses:
        '200':
          description: Route price updated; existing unexpired purchase intents keep their frozen quote
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaidRoute' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /v1/sellers/{sellerId}/transactions:
    get:
      summary: List transactions for a seller
      tags: [Sellers, Transactions]
      operationId: listSellerTransactions
      security: [{ sellerBearer: [] }]
      parameters:
        - { $ref: '#/components/parameters/SellerId' }
        - name: cursor
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
        - { $ref: '#/components/parameters/TransactionFrom' }
        - { $ref: '#/components/parameters/TransactionTo' }
        - { $ref: '#/components/parameters/TransactionRouteId' }
        - { $ref: '#/components/parameters/TransactionStatus' }
        - { $ref: '#/components/parameters/TransactionAsset' }
        - { $ref: '#/components/parameters/TransactionNetwork' }
      responses:
        '200':
          description: Seller transactions
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Transaction' }
                  nextCursor: { type: [string, 'null'] }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/sellers/{sellerId}/dashboard-summary:
    get:
      summary: Get bounded seller sales aggregates
      tags: [Sellers, Transactions]
      operationId: getSellerDashboardSummary
      security: [{ sellerBearer: [] }]
      parameters:
        - { $ref: '#/components/parameters/SellerId' }
        - { $ref: '#/components/parameters/TransactionFrom' }
        - { $ref: '#/components/parameters/TransactionTo' }
        - { $ref: '#/components/parameters/TransactionRouteId' }
        - { $ref: '#/components/parameters/TransactionStatus' }
        - { $ref: '#/components/parameters/TransactionAsset' }
        - { $ref: '#/components/parameters/TransactionNetwork' }
      responses:
        '200':
          description: Asset, network, route, UTC day, and reconciliation-stage aggregates
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DashboardSummary' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /v1/intents:
    post:
      summary: Create an immutable purchase intent
      tags: [Intents]
      operationId: createPurchaseIntent
      security: [{ agentApiKey: [] }]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateIntentRequest' }
      responses:
        '201':
          description: Immutable purchase intent created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PurchaseIntent' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
  /v1/intents/{intentId}:
    get:
      summary: Get a purchase intent
      tags: [Intents]
      operationId: getPurchaseIntent
      security: [{ agentApiKey: [] }, { sellerBearer: [] }]
      parameters: [{ $ref: '#/components/parameters/IntentId' }]
      responses:
        '200':
          description: Purchase intent
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PurchaseIntent' }
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/intents/{intentId}/approval-sessions:
    post:
      summary: Start a two-person approval session
      tags: [Approvals]
      operationId: createApprovalSession
      security: [{ agentApiKey: [] }]
      parameters:
        - { $ref: '#/components/parameters/IntentId' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [approvers]
              properties:
                approvers:
                  type: array
                  minItems: 2
                  maxItems: 2
                  items:
                    type: object
                    required: [label]
                    properties:
                      label: { type: string, minLength: 1, maxLength: 80 }
      responses:
        '201':
          description: Approval session and one-time invitation URLs
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApprovalSessionCreated' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /v1/approval-sessions/{sessionId}:
    get:
      summary: Get the current approval snapshot
      tags: [Approvals]
      operationId: getApprovalSession
      security: [{ agentApiKey: [] }, { approvalInvite: [] }]
      parameters: [{ $ref: '#/components/parameters/SessionId' }]
      responses:
        '200':
          description: Current approval snapshot
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApprovalSession' }
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/approval-sessions/{sessionId}/decisions:
    post:
      summary: Approve or veto a purchase
      tags: [Approvals]
      operationId: decideApproval
      security: [{ approvalInvite: [] }]
      parameters:
        - { $ref: '#/components/parameters/SessionId' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision: { type: string, enum: [approve, veto] }
      responses:
        '200':
          description: Updated approval snapshot; approvalToken is returned only when the session first resolves approved
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/ApprovalSession' }
                  - type: object
                    properties:
                      approvalToken: { type: string }
        '409': { $ref: '#/components/responses/Conflict' }
        '410': { $ref: '#/components/responses/Gone' }
  /v1/transactions/{transactionId}:
    get:
      summary: Get a transaction and its evidence chain
      tags: [Transactions]
      operationId: getTransaction
      security: [{ agentApiKey: [] }, { sellerBearer: [] }]
      parameters: [{ $ref: '#/components/parameters/TransactionId' }]
      responses:
        '200':
          description: Transaction and evidence verification summary
          content:
            application/json:
              schema:
                type: object
                required: [transaction, evidence]
                properties:
                  transaction: { $ref: '#/components/schemas/Transaction' }
                  evidence:
                    type: object
                    required: [valid, events]
                    properties:
                      valid: { type: boolean }
                      events:
                        type: array
                        items: { $ref: '#/components/schemas/EvidenceEvent' }
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/transactions/{transactionId}/receipt:
    get:
      summary: Download a verified machine-readable purchase receipt
      tags: [Transactions]
      operationId: downloadPurchaseReceipt
      security: [{ agentApiKey: [] }, { sellerBearer: [] }]
      parameters: [{ $ref: '#/components/parameters/TransactionId' }]
      responses:
        '200':
          description: Versioned receipt backed by a verified evidence chain
          headers:
            Content-Disposition:
              schema: { type: string }
          content:
            application/vnd.agentpay.receipt+json:
              schema: { $ref: '#/components/schemas/PurchaseReceipt' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /v1/disputes:
    post:
      summary: Open and classify a dispute
      tags: [Disputes]
      operationId: createDispute
      security: [{ agentApiKey: [] }, { sellerBearer: [] }]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateDisputeRequest' }
      responses:
        '201':
          description: Dispute classified
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Dispute' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /v1/disputes/{disputeId}:
    get:
      summary: Get a dispute
      tags: [Disputes]
      operationId: getDispute
      security: [{ agentApiKey: [] }, { sellerBearer: [] }]
      parameters:
        - name: disputeId
          in: path
          required: true
          schema: { type: string, pattern: '^dsp_[A-Za-z0-9]+$' }
      responses:
        '200':
          description: Dispute
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Dispute' }
        '404': { $ref: '#/components/responses/NotFound' }
  /store/{slug}/manifest.json:
    get:
      summary: Get a storefront manifest
      tags: [Storefront]
      operationId: getStorefrontManifest
      security: []
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string, pattern: '^[a-z0-9-]+$' }
      responses:
        '200':
          description: Machine-readable paid route manifest
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StorefrontManifest' }
        '404': { $ref: '#/components/responses/NotFound' }
  /store/{slug}/llms.txt:
    get:
      summary: Get the storefront agent-discovery document
      tags: [Storefront]
      operationId: getStorefrontLlmsText
      security: []
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string, pattern: '^[a-z0-9-]+$' }
      responses:
        '200':
          description: Plain-text agent discovery document
          content:
            text/plain:
              schema: { type: string }
        '404': { $ref: '#/components/responses/NotFound' }
  /pay/{slug}/{proxyPath}:
    parameters:
      - name: slug
        in: path
        required: true
        schema: { type: string }
      - name: proxyPath
        in: path
        required: true
        description: Greedy path parameter in API Gateway deployment
        schema: { type: string }
      - name: X-AgentPay-Intent-Id
        in: header
        required: true
        schema: { type: string }
      - name: X-AgentPay-Approval
        in: header
        required: false
        schema: { type: string }
      - name: PAYMENT-SIGNATURE
        in: header
        required: false
        schema: { type: string }
    get:
      summary: Purchase a configured GET resource
      tags: [Proxy]
      operationId: getPaidResource
      security: [{ agentApiKey: [] }]
      responses: { '200': { $ref: '#/components/responses/ProxiedResponse' }, '402': { $ref: '#/components/responses/PaymentRequired' }, '428': { $ref: '#/components/responses/ApprovalRequired' } }
    post:
      summary: Purchase a configured POST resource
      tags: [Proxy]
      operationId: postPaidResource
      security: [{ agentApiKey: [] }]
      requestBody:
        required: false
        content:
          application/json:
            schema: {}
      responses: { '200': { $ref: '#/components/responses/ProxiedResponse' }, '402': { $ref: '#/components/responses/PaymentRequired' }, '428': { $ref: '#/components/responses/ApprovalRequired' } }
components:
  securitySchemes:
    sellerBearer: { type: http, scheme: bearer, bearerFormat: JWT }
    agentApiKey: { type: apiKey, in: header, name: X-AgentPay-Agent-Key }
    approvalInvite: { type: apiKey, in: query, name: token }
  parameters:
    IdempotencyKey: { name: Idempotency-Key, in: header, required: true, schema: { type: string, minLength: 8, maxLength: 128, pattern: '^[A-Za-z0-9._:-]+$' } }
    SellerId: { name: sellerId, in: path, required: true, schema: { type: string, pattern: '^sel_[A-Za-z0-9]+$' } }
    RouteId: { name: routeId, in: path, required: true, schema: { type: string, pattern: '^rte_[A-Za-z0-9]+$' } }
    IntentId: { name: intentId, in: path, required: true, schema: { type: string, pattern: '^int_[A-Za-z0-9]+$' } }
    SessionId: { name: sessionId, in: path, required: true, schema: { type: string, pattern: '^aps_[A-Za-z0-9]+$' } }
    TransactionId: { name: transactionId, in: path, required: true, schema: { type: string, pattern: '^txn_[A-Za-z0-9]+$' } }
    CredentialId: { name: credentialId, in: path, required: true, schema: { type: string, pattern: '^key_[A-Za-z0-9]+$' } }
    DestinationId: { name: destinationId, in: path, required: true, schema: { type: string, pattern: '^dst_[A-Za-z0-9]+$' } }
    DeliveryId: { name: deliveryId, in: path, required: true, schema: { type: string, pattern: '^whd_[A-Za-z0-9]+$' } }
    DeliveryLimit: { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
    DeliveryCursor: { name: cursor, in: query, required: false, schema: { type: string, pattern: '^whd_[A-Za-z0-9]+$' } }
    TransactionFrom: { name: from, in: query, required: false, schema: { type: string, format: date-time } }
    TransactionTo: { name: to, in: query, required: false, schema: { type: string, format: date-time } }
    TransactionRouteId: { name: routeId, in: query, required: false, schema: { type: string, pattern: '^rte_[A-Za-z0-9]+$' } }
    TransactionStatus: { name: status, in: query, required: false, schema: { type: string, enum: [PROPOSED, APPROVAL_PENDING, APPROVED, PAYMENT_REQUIRED, PAYMENT_VERIFIED, FORWARDED, FULFILLED, FAILED, DISPUTED, REFUND_RECOMMENDED, RESOLVED] } }
    TransactionAsset: { name: asset, in: query, required: false, schema: { type: string, minLength: 1, maxLength: 160 } }
    TransactionNetwork: { name: network, in: query, required: false, schema: { type: string, minLength: 1, maxLength: 80 } }
  schemas:
    CreateSellerRequest:
      type: object
      additionalProperties: false
      required: [name, slug, upstreamBaseUrl]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        slug: { type: string, pattern: '^[a-z0-9-]{3,48}$' }
        upstreamBaseUrl: { type: string, format: uri }
    Seller:
      type: object
      required: [sellerId, name, slug, upstreamBaseUrl, status, createdAt, updatedAt, version]
      properties:
        sellerId: { type: string }
        name: { type: string }
        slug: { type: string }
        upstreamBaseUrl: { type: string, format: uri }
        status: { type: string, enum: [draft, active, suspended] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        version: { type: integer, minimum: 1 }
    PlanLimits:
      type: object
      additionalProperties: false
      required: [apiRequestsPerMonth, mcpOperationsPerMonth, publishedRoutes, webhookSubscriptions, webhookDeliveriesPerMonth, analyticsWindowDays, evidenceRetentionDays]
      properties:
        apiRequestsPerMonth: { type: integer, minimum: 1 }
        mcpOperationsPerMonth: { type: integer, minimum: 1 }
        publishedRoutes: { type: integer, minimum: 1 }
        webhookSubscriptions: { type: integer, minimum: 1 }
        webhookDeliveriesPerMonth: { type: integer, minimum: 1 }
        analyticsWindowDays: { type: integer, minimum: 1 }
        evidenceRetentionDays: { type: integer, minimum: 1 }
    PlanFeatures:
      type: object
      additionalProperties: false
      required: [approvals, webhooks, advancedAnalytics, prioritySupport]
      properties:
        approvals: { type: boolean }
        webhooks: { type: boolean }
        advancedAnalytics: { type: boolean }
        prioritySupport: { type: boolean }
    PlanDefinition:
      type: object
      additionalProperties: false
      required: [planId, planVersion, displayName, limits, features]
      properties:
        planId: { type: string, enum: [starter, growth, scale] }
        planVersion: { type: integer, const: 1 }
        displayName: { type: string }
        limits: { $ref: '#/components/schemas/PlanLimits' }
        features: { $ref: '#/components/schemas/PlanFeatures' }
    SellerPlan:
      type: object
      additionalProperties: false
      required: [sellerId, planId, planVersion, status, billingPeriodStart, billingPeriodEnd, assignedAt, updatedAt, version]
      properties:
        sellerId: { type: string, pattern: '^sel_[A-Za-z0-9]+$' }
        planId: { type: string, enum: [starter, growth, scale] }
        planVersion: { type: integer, const: 1 }
        status: { type: string, enum: [active, suspended] }
        billingPeriodStart: { type: string, format: date-time }
        billingPeriodEnd: { type: string, format: date-time }
        assignedAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        version: { type: integer, minimum: 1 }
    SellerPlanResponse:
      type: object
      additionalProperties: false
      required: [assignment, plan]
      properties:
        assignment: { $ref: '#/components/schemas/SellerPlan' }
        plan: { $ref: '#/components/schemas/PlanDefinition' }
    CreateRouteRequest:
      type: object
      additionalProperties: false
      required: [method, pathPattern, description, mimeType, amount, asset, network, payTo]
      properties:
        method: { type: string, enum: [GET, POST] }
        pathPattern: { type: string, pattern: '^/[A-Za-z0-9/_-]+$' }
        description: { type: string, minLength: 1, maxLength: 500 }
        mimeType: { type: string, maxLength: 120 }
        amount: { $ref: '#/components/schemas/PositiveAtomicAmount' }
        asset: { type: string, minLength: 1, maxLength: 160 }
        network: { type: string, minLength: 1, maxLength: 80 }
        payTo: { type: string, minLength: 1, maxLength: 160 }
        approvalThresholdAmount: { oneOf: [{ $ref: '#/components/schemas/AtomicAmount' }, { type: 'null' }] }
        upstreamTimeoutSeconds: { type: integer, minimum: 1, maximum: 30, default: 20 }
    CreatePaymentDestinationRequest:
      type: object
      additionalProperties: false
      required: [asset, network, address]
      properties:
        asset: { type: string, minLength: 1, maxLength: 160 }
        network: { type: string, minLength: 1, maxLength: 80 }
        address: { type: string, minLength: 1, maxLength: 256 }
    PaymentDestination:
      type: object
      additionalProperties: false
      required: [destinationId, sellerId, asset, network, address, status, createdAt, updatedAt, version]
      properties:
        destinationId: { type: string, pattern: '^dst_[A-Za-z0-9]+$' }
        sellerId: { type: string, pattern: '^sel_[A-Za-z0-9]+$' }
        asset: { type: string }
        network: { type: string }
        address: { type: string }
        status: { type: string, enum: [pending_verification, active, disabled, rotated] }
        challengeExpiresAt: { type: [string, 'null'], format: date-time }
        verifiedAt: { type: [string, 'null'], format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        version: { type: integer, minimum: 1 }
    OwnershipChallenge:
      type: object
      additionalProperties: false
      required: [challenge, expiresAt]
      properties:
        challenge: { type: string, minLength: 1, maxLength: 2048 }
        expiresAt: { type: string, format: date-time }
    VerifyPaymentDestinationRequest:
      type: object
      additionalProperties: false
      required: [challenge, signature]
      properties:
        challenge: { type: string, minLength: 1, maxLength: 2048 }
        signature: { type: string, minLength: 1, maxLength: 4096 }
        confirmRotation: { type: boolean }
    WebhookEventType:
      type: string
      enum: [payment.verified, fulfillment.succeeded, fulfillment.failed, dispute.changed]
    CreateWebhookSubscriptionRequest:
      type: object
      additionalProperties: false
      required: [endpointUrl, eventTypes]
      properties:
        endpointUrl: { type: string, format: uri, pattern: '^https://' }
        eventTypes:
          type: array
          minItems: 1
          uniqueItems: true
          items: { $ref: '#/components/schemas/WebhookEventType' }
    WebhookSubscription:
      type: object
      additionalProperties: false
      required: [subscriptionId, sellerId, endpointUrl, eventTypes, status, createdAt, updatedAt, version]
      properties:
        subscriptionId: { type: string, pattern: '^whk_[A-Za-z0-9]+$' }
        sellerId: { type: string, pattern: '^sel_[A-Za-z0-9]+$' }
        endpointUrl: { type: string, format: uri, pattern: '^https://' }
        eventTypes:
          type: array
          items: { $ref: '#/components/schemas/WebhookEventType' }
        status: { type: string, enum: [active, disabled] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        version: { type: integer, minimum: 1 }
    WebhookSubscriptionCreated:
      allOf:
        - { $ref: '#/components/schemas/WebhookSubscription' }
        - type: object
          required: [signingSecret]
          properties:
            signingSecret: { type: string, minLength: 32 }
    WebhookDelivery:
      type: object
      additionalProperties: false
      required: [deliveryId, sellerId, subscriptionId, eventId, eventType, payloadHash, status, attemptCount, createdAt, updatedAt, version]
      properties:
        deliveryId: { type: string, pattern: '^whd_[A-Za-z0-9]+$' }
        sellerId: { type: string, pattern: '^sel_[A-Za-z0-9]+$' }
        subscriptionId: { type: string, pattern: '^whk_[A-Za-z0-9]+$' }
        eventId: { type: string, pattern: '^evt_[A-Za-z0-9]+$' }
        eventType: { $ref: '#/components/schemas/WebhookEventType' }
        payloadHash: { $ref: '#/components/schemas/Sha256' }
        status: { type: string, enum: [pending, retry_scheduled, delivered, dead_letter] }
        attemptCount: { type: integer, minimum: 0 }
        nextAttemptAt: { type: [string, 'null'], format: date-time }
        lastAttemptAt: { type: [string, 'null'], format: date-time }
        deliveredAt: { type: [string, 'null'], format: date-time }
        responseStatusCode: { type: [integer, 'null'], minimum: 100, maximum: 599 }
        responseBodyHash:
          oneOf:
            - { $ref: '#/components/schemas/Sha256' }
            - { type: 'null' }
        errorCode:
          type: [string, 'null']
          enum: [forbidden_target, timeout, unavailable, response_too_large, retryable_response, permanent_response, null]
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        version: { type: integer, minimum: 1 }
    CreateIntegrationCredentialRequest:
      type: object
      additionalProperties: false
      required: [label, scopes]
      properties:
        label: { type: string, minLength: 1, maxLength: 80 }
        scopes:
          type: array
          minItems: 1
          uniqueItems: true
          items: { type: string, enum: [read, configure, publish, validate, rotate] }
        expiresAt:
          type: [string, 'null']
          format: date-time
    IntegrationCredential:
      type: object
      additionalProperties: false
      required: [credentialId, sellerId, label, scopes, createdAt, updatedAt, version]
      properties:
        credentialId: { type: string, pattern: '^key_[A-Za-z0-9]+$' }
        sellerId: { type: string, pattern: '^sel_[A-Za-z0-9]+$' }
        label: { type: string }
        scopes:
          type: array
          items: { type: string, enum: [read, configure, publish, validate, rotate] }
        expiresAt: { type: [string, 'null'], format: date-time }
        revokedAt: { type: [string, 'null'], format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        version: { type: integer, minimum: 1 }
    IntegrationCredentialCreated:
      allOf:
        - { $ref: '#/components/schemas/IntegrationCredential' }
        - type: object
          required: [token]
          properties:
            token:
              type: string
              description: Raw project credential returned once and never persisted
    PaidRoute:
      allOf:
        - { $ref: '#/components/schemas/CreateRouteRequest' }
        - type: object
          required: [routeId, sellerId, enabled, createdAt, updatedAt, version]
          properties:
            routeId: { type: string }
            sellerId: { type: string }
            enabled: { type: boolean }
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }
            version: { type: integer, minimum: 1 }
    UpdateRoutePriceRequest:
      type: object
      additionalProperties: false
      required: [amount, expectedVersion]
      properties:
        amount: { $ref: '#/components/schemas/PositiveAtomicAmount' }
        expectedVersion: { type: integer, minimum: 1 }
    CreateIntentRequest:
      type: object
      additionalProperties: false
      required: [routeId, requestBodyHash, maximumAmount]
      properties:
        routeId: { type: string }
        requestBodyHash: { $ref: '#/components/schemas/Sha256' }
        maximumAmount: { $ref: '#/components/schemas/AtomicAmount' }
    PurchaseIntent:
      type: object
      required: [intentId, routeId, sellerId, buyerId, requestMethod, requestPath, amount, asset, network, requestBodyHash, intentHash, maximumAmount, requiresApproval, status, expiresAt, createdAt]
      properties:
        intentId: { type: string }
        routeId: { type: string }
        sellerId: { type: string }
        buyerId: { type: string }
        requestMethod: { type: string, enum: [GET, POST] }
        requestPath: { type: string, pattern: '^/[A-Za-z0-9/_-]+$' }
        amount: { $ref: '#/components/schemas/AtomicAmount' }
        asset: { type: string }
        network: { type: string }
        requestBodyHash: { $ref: '#/components/schemas/Sha256' }
        intentHash: { $ref: '#/components/schemas/Sha256' }
        maximumAmount: { $ref: '#/components/schemas/AtomicAmount' }
        requiresApproval: { type: boolean }
        status: { type: string, enum: [ready, approval_pending, approved, expired, executed] }
        expiresAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
    ApprovalSessionCreated:
      allOf:
        - { $ref: '#/components/schemas/ApprovalSession' }
        - type: object
          required: [invitations]
          properties:
            invitations:
              type: array
              items:
                type: object
                required: [label, url]
                properties:
                  label: { type: string }
                  url: { type: string, format: uri }
    ApprovalSession:
      type: object
      required: [sessionId, intentId, intentHash, requiredApprovals, decisions, status, expiresAt, createdAt, updatedAt, version]
      properties:
        sessionId: { type: string }
        intentId: { type: string }
        intentHash: { $ref: '#/components/schemas/Sha256' }
        requiredApprovals: { type: integer, const: 2 }
        decisions:
          type: array
          items:
            type: object
            required: [label, decision, decidedAt]
            properties:
              label: { type: string }
              decision: { type: string, enum: [approve, veto] }
              decidedAt: { type: string, format: date-time }
        status: { type: string, enum: [pending, approved, vetoed, expired] }
        expiresAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        version: { type: integer, minimum: 1 }
    Transaction:
      type: object
      required: [transactionId, intentId, sellerId, routeId, buyerId, status, amount, asset, network, createdAt, updatedAt]
      properties:
        transactionId: { type: string }
        intentId: { type: string }
        sellerId: { type: string }
        routeId: { type: string }
        buyerId: { type: string }
        status: { type: string, enum: [PROPOSED, APPROVAL_PENDING, APPROVED, PAYMENT_REQUIRED, PAYMENT_VERIFIED, FORWARDED, FULFILLED, FAILED, DISPUTED, REFUND_RECOMMENDED, RESOLVED] }
        amount: { $ref: '#/components/schemas/AtomicAmount' }
        asset: { type: string }
        network: { type: string }
        paymentFinality: { type: string, enum: [confirmed, finalized, failed] }
        paymentReference: { type: string, minLength: 1, maxLength: 512 }
        reconciledAt: { type: string, format: date-time }
        reconciliation: { $ref: '#/components/schemas/PaymentReconciliation' }
        upstreamStatus: { type: [integer, 'null'] }
        responseHash: { oneOf: [{ $ref: '#/components/schemas/Sha256' }, { type: 'null' }] }
        failureCode: { type: [string, 'null'] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    PurchaseReceipt:
      type: object
      additionalProperties: false
      required: [schemaVersion, transaction, evidence]
      properties:
        schemaVersion: { type: string, const: '1' }
        transaction:
          type: object
          additionalProperties: false
          required: [transactionId, intentId, sellerId, routeId, buyerId, status, amount, asset, network, paymentFinality, paymentReference, createdAt, updatedAt]
          properties:
            transactionId: { type: string, pattern: '^txn_[A-Za-z0-9]+$' }
            intentId: { type: string, pattern: '^int_[A-Za-z0-9]+$' }
            sellerId: { type: string, pattern: '^sel_[A-Za-z0-9]+$' }
            routeId: { type: string, pattern: '^rte_[A-Za-z0-9]+$' }
            buyerId: { type: string }
            status: { type: string, enum: [PAYMENT_VERIFIED, FORWARDED, FULFILLED, FAILED, DISPUTED, REFUND_RECOMMENDED, RESOLVED] }
            amount: { $ref: '#/components/schemas/AtomicAmount' }
            asset: { type: string }
            network: { type: string }
            paymentFinality: { type: string, const: finalized }
            paymentReference: { type: string, minLength: 1, maxLength: 512 }
            reconciledAt: { type: [string, 'null'], format: date-time }
            upstreamStatus: { type: [integer, 'null'] }
            responseHash: { oneOf: [{ $ref: '#/components/schemas/Sha256' }, { type: 'null' }] }
            failureCode: { type: [string, 'null'] }
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }
        evidence:
          type: object
          additionalProperties: false
          required: [verified, eventCount, rootEventHash, headEventHash, events]
          properties:
            verified: { type: boolean, const: true }
            eventCount: { type: integer, minimum: 1 }
            rootEventHash: { $ref: '#/components/schemas/Sha256' }
            headEventHash: { $ref: '#/components/schemas/Sha256' }
            events:
              type: array
              minItems: 1
              items: { $ref: '#/components/schemas/EvidenceEvent' }
    PaymentReconciliation:
      type: object
      additionalProperties: false
      required: [stage, amount, asset, network]
      properties:
        stage: { type: string, enum: [challenged, verified, finalized, fulfilled, failed, disputed] }
        amount: { $ref: '#/components/schemas/AtomicAmount' }
        asset: { type: string }
        network: { type: string }
        paymentReference: { type: string, minLength: 1, maxLength: 512 }
        reconciledAt: { type: string, format: date-time }
    SalesAggregate:
      type: object
      additionalProperties: false
      required: [sellerId, bucketDate, asset, network, stage, transactionCount, amount, lastTransactionAt]
      properties:
        sellerId: { type: string, pattern: '^sel_[A-Za-z0-9]+$' }
        bucketDate: { type: string, format: date }
        asset: { type: string }
        network: { type: string }
        routeId: { type: string, pattern: '^rte_[A-Za-z0-9]+$' }
        stage: { type: string, enum: [challenged, verified, finalized, fulfilled, failed, disputed] }
        transactionCount: { type: integer, minimum: 0 }
        amount: { $ref: '#/components/schemas/AtomicAmount' }
        lastTransactionAt: { type: string, format: date-time }
    DashboardSummary:
      type: object
      additionalProperties: false
      required: [transactionCount, aggregates]
      properties:
        transactionCount: { type: integer, minimum: 0, maximum: 1000 }
        aggregates:
          type: array
          items: { $ref: '#/components/schemas/SalesAggregate' }
    EvidenceEvent:
      type: object
      required: [eventId, transactionId, sequence, eventType, actorType, payload, eventHash, kmsKeyId, kmsSignature, createdAt]
      properties:
        eventId: { type: string }
        transactionId: { type: string }
        sequence: { type: integer, minimum: 1 }
        eventType: { type: string }
        actorType: { type: string, enum: [system, seller, buyer, approver] }
        actorId: { type: [string, 'null'] }
        payload: { type: object }
        previousEventHash: { oneOf: [{ $ref: '#/components/schemas/Sha256' }, { type: 'null' }] }
        eventHash: { $ref: '#/components/schemas/Sha256' }
        kmsKeyId: { type: string }
        kmsSignature: { type: string }
        createdAt: { type: string, format: date-time }
    CreateDisputeRequest:
      type: object
      additionalProperties: false
      required: [transactionId, reason]
      properties:
        transactionId: { type: string }
        reason: { type: string, enum: [unauthorized, duplicate, wrong_amount, not_delivered, quality_or_output] }
        statement: { type: string, maxLength: 2000 }
    Dispute:
      type: object
      required: [disputeId, transactionId, reason, status, ruleVersion, classificationCode, explanation, createdAt]
      properties:
        disputeId: { type: string }
        transactionId: { type: string }
        reason: { type: string, enum: [unauthorized, duplicate, wrong_amount, not_delivered, quality_or_output] }
        status: { type: string, enum: [open, refund_recommended, seller_review, denied, resolved] }
        ruleVersion: { type: string, const: dispute-rules-v1 }
        classificationCode: { type: string }
        explanation: { type: string }
        createdAt: { type: string, format: date-time }
    StorefrontManifest:
      type: object
      required: [seller, routes]
      properties:
        seller:
          type: object
          required: [name, slug]
          properties:
            name: { type: string }
            slug: { type: string }
        routes:
          type: array
          items: { $ref: '#/components/schemas/PaidRoute' }
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, requestId]
          properties:
            code: { type: string }
            message: { type: string }
            requestId: { type: string }
            details: { type: object }
    AtomicAmount: { type: string, pattern: '^[0-9]+$', example: '10000' }
    PositiveAtomicAmount: { type: string, pattern: '^[1-9][0-9]*$', example: '35000000' }
    Sha256: { type: string, pattern: '^[a-f0-9]{64}$' }
  responses:
    SellerCreated:
      description: Seller created
      content: { application/json: { schema: { $ref: '#/components/schemas/Seller' } } }
    ProxiedResponse:
      description: Successful seller response
      headers:
        X-AgentPay-Transaction-Id: { schema: { type: string } }
        PAYMENT-RESPONSE: { schema: { type: string }, description: x402 v2 settlement response when supplied by the payment adapter }
      content: { application/json: { schema: {} } }
    PaymentRequired:
