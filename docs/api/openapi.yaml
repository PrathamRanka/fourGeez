      tags: [Sellers, Disputes]
      operationId: getManualRefundRecord
      security: [{ sellerBearer: [] }]
      parameters:
        - { $ref: '#/components/parameters/SellerId' }
        - { $ref: '#/components/parameters/DisputeId' }
      responses:
        '200':
          description: Existing seller-reported refund record
          headers:
            Cache-Control: { schema: { type: string, const: no-store } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ManualRefundRecord' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/PermissionDenied' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/DependencyUnavailable' }
  /store/{slug}/manifest.json:
    get:
      summary: Get a storefront manifest
      tags: [Storefront]
      operationId: getStorefrontManifest
      security: []
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string, pattern: '^[a-z0-9-]+$' }
      responses:
        '200':
          description: Short-lived signed active storefront discovery document
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SignedStorefrontManifest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '410':
          description: Known storefront is inactive; the signed tombstone contains no products
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SignedStorefrontTombstone' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/DependencyUnavailable' }
  /v1/discovery/products:
    get:
      summary: List or exactly filter active public products
      description: Returns deterministic candidate discovery only. Listing and search use maintained DynamoDB query partitions, never a production table scan. The service freshly revalidates seller entitlement, seller and route state, publication readiness, and payment destination before returning each product. Search terms use lowercase Unicode letter-or-digit normalization, exact term matching, AND semantics, and no scoring or ranking.
      tags: [Storefront]
      operationId: listPublicProducts
      security: []
      parameters:
        - name: q
          in: query
          required: false
          description: One to four whitespace-separated exact terms after normalization; each term must contain 2-32 Unicode letters or digits.
          schema: { type: string, minLength: 2, maxLength: 131 }
        - name: asset
          in: query
          required: false
          schema: { type: string, minLength: 1, maxLength: 160 }
        - name: network
          in: query
          required: false
          schema: { type: string, minLength: 1, maxLength: 80 }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 24, default: 12 }
        - name: cursor
          in: query
          required: false
          schema: { type: string, minLength: 1, maxLength: 2048 }
      responses:
        '200':
          description: Stable lexical page of freshly eligible product candidates
          headers:
            Cache-Control: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublicProductDirectoryPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/DependencyUnavailable' }
  /store/{slug}/llms.txt:
    get:
      summary: Get the storefront agent-discovery document
      tags: [Storefront]
      operationId: getStorefrontLlmsText
      security: []
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string, pattern: '^[a-z0-9-]+$' }
      responses:
        '200':
          description: Plain-text projection of the latest server-authorized signed storefront catalog revision
          headers:
            Cache-Control: { schema: { type: string } }
          content:
            text/plain:
              schema: { type: string }
        '404': { $ref: '#/components/responses/NotFound' }
        '410': { $ref: '#/components/responses/SellerInactive' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/DependencyUnavailable' }
  /v1/storefronts/{sellerSlug}/products/{productSlug}:
    get:
      summary: Resolve one active public product by seller and product slug
      tags: [Storefront]
      operationId: getPublicProduct
      security: []
      parameters:
        - { $ref: '#/components/parameters/SellerSlug' }
        - { $ref: '#/components/parameters/ProductSlug' }
      responses:
        '200':
          description: Signed public product document; discovery does not authorize a purchase
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SignedPublicProductDocument' }
        '404': { $ref: '#/components/responses/NotFound' }
        '410': { $ref: '#/components/responses/SellerInactive' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/DependencyUnavailable' }
  /v1/storefronts/{sellerSlug}/products/{productSlug}/purchase-sessions:
    post:
      summary: Create a bounded browser purchase session for one public product
      description: Creates an opaque server-side browser grant distinct from seller sessions, project keys, and buyer-agent keys. Its commerce authority expires within ten minutes. After finalized payment, read/recovery authority lasts until 30 days after terminal fulfillment/failure or a timely dispute's resolution.
      tags: [Authorization, Storefront]
      operationId: createBrowserPurchaseSession
      security: []
      parameters:
        - { $ref: '#/components/parameters/SellerSlug' }
        - { $ref: '#/components/parameters/ProductSlug' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateBrowserPurchaseSessionRequest' }
      responses:
        '201':
          description: Browser purchase session with durable same-origin authorization cookies
          headers:
            Cache-Control: { schema: { type: string, const: no-store } }
            Set-Cookie:
              schema: { type: string }
              description: Repeated header setting opaque __Host-agentpay_purchase authorization and non-HttpOnly __Host-agentpay_purchase_csrf double-submit cookies; both use Secure, SameSite=Strict, Path=/, and no Domain.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BrowserPurchaseSessionCreated' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '410': { $ref: '#/components/responses/SellerInactive' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/DependencyUnavailable' }
  /v1/browser-purchases/{purchaseSessionId}/recovery-challenges:
    post:
      summary: Create a wallet-bound browser purchase recovery challenge
      description: Available only after a verified payer wallet has been bound to the purchase session. It grants no commerce authority.
      tags: [Authorization]
      operationId: createBrowserPurchaseRecoveryChallenge
      security: []
      parameters:
        - { $ref: '#/components/parameters/PurchaseSessionId' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BrowserPurchaseRecoveryChallengeRequest' }
      responses:
        '201':
          description: Short-lived wallet-signature challenge
          headers:
            Cache-Control: { schema: { type: string, const: no-store } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BrowserPurchaseRecoveryChallenge' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '410': { $ref: '#/components/responses/Gone' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/DependencyUnavailable' }
  /v1/browser-purchases/{purchaseSessionId}/recover:
    post:
      summary: Restore read and remediation access to a browser purchase
      description: Verifies a one-time challenge against the wallet bound by finalized payment and restores only transaction, receipt, evidence, and dispute authority. It cannot create another intent or payment.
      tags: [Authorization]
      operationId: recoverBrowserPurchase
      security: []
      parameters:
        - { $ref: '#/components/parameters/PurchaseSessionId' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RecoverBrowserPurchaseRequest' }
      responses:
        '204':
          description: Browser purchase authorization restored
          headers:
            Cache-Control: { schema: { type: string, const: no-store } }
            Set-Cookie:
              schema: { type: string }
              description: Repeated header restoring opaque __Host-agentpay_purchase authorization and __Host-agentpay_purchase_csrf cookies.
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '410': { $ref: '#/components/responses/Gone' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/DependencyUnavailable' }
  /v1/payment-capabilities:
    get:
      summary: Get the payment capabilities enabled by this runtime
      description: Returns enabled capabilities only, in deterministic negotiation order. Omitted rails, networks, and assets are unsupported.
      tags: [Payments]
      operationId: getPaymentCapabilities
      security: []
      responses:
        '200':
          description: Runtime-enabled payment capability catalog
          headers:
            Cache-Control: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaymentCapabilityCatalog' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /v1/payment-capabilities/compatibility:
    post:
      summary: Detect compatibility for an external x402 buyer
      description: Compares a bounded external-buyer capability declaration with the payment adapter enabled by this runtime. The operation is stateless, creates no intent or transaction, accepts no credentials, and never treats a seller project key as buyer authentication.
      tags: [Payments]
      operationId: detectExternalBuyerCompatibility
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ExternalBuyerCompatibilityRequest' }
      responses:
        '200':
          description: Deterministic compatible or unsupported result
          headers:
            Cache-Control: { schema: { type: string, const: no-store } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExternalBuyerCompatibilityResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /pay/{slug}/{proxyPath}:
    parameters:
      - name: slug
        in: path
        required: true
        schema: { type: string }
      - name: proxyPath
        in: path
        required: true
        description: Greedy path parameter in API Gateway deployment
        schema: { type: string }
      - name: X-AgentPay-Intent-Id
        in: header
        required: true
        schema: { type: string }
      - name: PAYMENT-SIGNATURE
        in: header
        required: false
        schema: { type: string }
      - { $ref: '#/components/parameters/PurchaseCsrfToken' }
    get:
      summary: Purchase a configured GET resource
      tags: [Proxy]
      operationId: getPaidResource
      security: [{ buyerAgentKey: [] }, { browserPurchaseCookie: [] }]
      responses:
        '200': { $ref: '#/components/responses/ProxiedResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/PaymentRequired' }
        '403': { $ref: '#/components/responses/PermissionDenied' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '410': { $ref: '#/components/responses/CommerceGone' }
        '422': { $ref: '#/components/responses/PaymentCapabilityUnsupported' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/PaymentUnavailable' }
    post:
      summary: Purchase a configured POST resource
      description: |
        The JSON body is required and must validate against the authoritative
        published route inputSchema before AgentPay creates a transaction,
        returns an x402 challenge, verifies a proof, or settles payment.
        Products with no input properties send an empty JSON object. The normal
        request body must match the immutable purchase intent. After
        a finalized transaction fails fulfillment, the same endpoint accepts
        one corrected body only when the stored recovery state is
        retry_available. The caller must resend the identical PAYMENT-SIGNATURE;
        AgentPay compares its stored hash and does not verify or settle again.
      tags: [Proxy]
      operationId: postPaidResource
      security: [{ buyerAgentKey: [] }, { browserPurchaseCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200': { $ref: '#/components/responses/ProxiedResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/PaymentRequired' }
        '403': { $ref: '#/components/responses/PermissionDenied' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '410': { $ref: '#/components/responses/CommerceGone' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/PaymentUnavailable' }
components:
  securitySchemes:
    sellerBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Seller-scoped service credential derived from the authenticated web session by the trusted web/BFF boundary; it is never stored in browser JavaScript or accepted as a substitute for ownership checks.
    projectKey:
      type: apiKey
      in: header
      name: X-AgentPay-Project-Key
      description: Proprietary seller project bootstrap credential accepted only by the integration access-token exchange.
    buyerAgentKey:
      type: apiKey
      in: header
      name: X-AgentPay-Agent-Key
      description: Buyer-agent credential; never a seller project key.
    browserPurchaseCookie:
      type: apiKey
      in: cookie
      name: __Host-agentpay_purchase
      description: Opaque server-side browser grant. Commerce authority expires separately from longer-lived read and remediation access.
    stripeWebhookSignature:
      type: apiKey
      in: header
      name: Stripe-Signature
      description: Stripe-generated signature verified against the exact raw request body and the environment-specific webhook endpoint secret.
  parameters:
    IdempotencyKey: { name: Idempotency-Key, in: header, required: true, schema: { type: string, minLength: 8, maxLength: 128, pattern: '^[A-Za-z0-9._:-]+$' } }
    SellerId: { name: sellerId, in: path, required: true, schema: { type: string, pattern: '^sel_[A-Za-z0-9]+$' } }
    RouteId: { name: routeId, in: path, required: true, schema: { type: string, pattern: '^rte_[A-Za-z0-9]+$' } }
    IntentId: { name: intentId, in: path, required: true, schema: { type: string, pattern: '^int_[A-Za-z0-9]+$' } }
    TransactionId: { name: transactionId, in: path, required: true, schema: { type: string, pattern: '^txn_[A-Za-z0-9]+$' } }
    CredentialId: { name: credentialId, in: path, required: true, schema: { type: string, pattern: '^key_[A-Za-z0-9]+$' } }
    DestinationId: { name: destinationId, in: path, required: true, schema: { type: string, pattern: '^dst_[A-Za-z0-9]+$' } }
    DisputeId: { name: disputeId, in: path, required: true, schema: { type: string, pattern: '^dsp_[A-Za-z0-9]+$' } }
    DeliveryId: { name: deliveryId, in: path, required: true, schema: { type: string, pattern: '^whd_[A-Za-z0-9]+$' } }
    SellerSlug: { name: sellerSlug, in: path, required: true, schema: { type: string, pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$', minLength: 3, maxLength: 48 } }
    ProductSlug: { name: productSlug, in: path, required: true, schema: { type: string, pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$', minLength: 3, maxLength: 80 } }
    PurchaseSessionId: { name: purchaseSessionId, in: path, required: true, schema: { type: string, pattern: '^bps_[A-Za-z0-9]+$' } }
    PurchaseCsrfToken:
      name: X-AgentPay-CSRF
      in: header
      required: false
      description: Required for every state-changing request, including paid GET execution, when browserPurchaseCookie is used; ignored for buyer-agent key authentication. It must match the __Host-agentpay_purchase_csrf double-submit cookie and the request Origin must be allowlisted.
      schema: { type: string, minLength: 32, maxLength: 256 }
    DeliveryLimit: { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
    DeliveryCursor: { name: cursor, in: query, required: false, schema: { type: string, pattern: '^whd_[A-Za-z0-9]+$' } }
    AuditLimit: { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
    AuditCursor: { name: cursor, in: query, required: false, schema: { type: string, minLength: 1, maxLength: 512 } }
    TransactionFrom: { name: from, in: query, required: false, schema: { type: string, format: date-time } }
    TransactionTo: { name: to, in: query, required: false, schema: { type: string, format: date-time } }
    DashboardFrom: { name: from, in: query, required: true, description: Inclusive UTC start of the bounded reporting window., schema: { type: string, format: date-time } }
    DashboardTo: { name: to, in: query, required: true, description: Exclusive UTC end of the bounded reporting window; the interval must not exceed 31 days., schema: { type: string, format: date-time } }
    TransactionRouteId: { name: routeId, in: query, required: false, schema: { type: string, pattern: '^rte_[A-Za-z0-9]+$' } }
    TransactionStatus: { name: status, in: query, required: false, schema: { type: string, enum: [PROPOSED, PAYMENT_REQUIRED, PAYMENT_VERIFIED, FORWARDED, FULFILLED, FAILED, DISPUTED, REFUND_RECOMMENDED, RESOLVED] } }
    TransactionActivityMode: { name: activityMode, in: query, required: false, schema: { type: string, enum: [test, live] } }
    TransactionOutcome: { name: outcome, in: query, required: false, schema: { type: string, enum: [awaiting_payment, abandoned, payment_rejected, payment_processing, fulfilling, fulfilled, fulfillment_failed, disputed, refund_recommended, resolved] } }
    TransactionAsset: { name: asset, in: query, required: false, schema: { type: string, minLength: 1, maxLength: 160 } }
    TransactionNetwork: { name: network, in: query, required: false, schema: { type: string, minLength: 1, maxLength: 80 } }
  schemas:
    JsonWebKeySet:
      type: object
      additionalProperties: false
      required: [keys]
      properties:
        keys:
          type: array
          minItems: 1
          items:
            type: object
            additionalProperties: false
            required: [kty, use, key_ops, alg, kid, crv, x, y]
            properties:
              kty: { type: string, const: EC }
              use: { type: string, const: sig }
              key_ops:
                type: array
                items: { type: string, const: verify }
                minItems: 1
                maxItems: 1
              alg: { type: string, const: ES256 }
              kid: { type: string, minLength: 1, maxLength: 128 }
              crv: { type: string, const: P-256 }
              x: { type: string, minLength: 43, maxLength: 43 }
              y: { type: string, minLength: 43, maxLength: 43 }
    IntegrationAccessTokenRequest:
      type: object
      additionalProperties: false
      required: [audience, scopes]
      properties:
        audience: { type: string, const: 'urn:agentpay:mcp' }
        scopes:
          type: array
          minItems: 1
          uniqueItems: true
          items: { type: string, enum: [read, configure, publish, validate] }
    IntegrationAccessTokenResponse:
      type: object
      additionalProperties: false
      required: [accessToken, tokenType, expiresIn, scope, sellerId, credentialId, entitlementEpoch]
      properties:
        accessToken:
          type: string
          description: ES256 JWT with typ agentpay-access+jwt; never persist or log it.
        tokenType: { type: string, const: Bearer }
        expiresIn: { type: integer, minimum: 120, maximum: 300 }
        scope: { type: string, pattern: '^[a-z]+(?: [a-z]+)*$' }
        sellerId: { type: string, pattern: '^sel_[A-Za-z0-9]+$' }
        credentialId: { type: string, pattern: '^key_[A-Za-z0-9]+$' }
        entitlementEpoch: { type: integer, minimum: 1 }
    CreateMcpConfirmationGrantRequest:
      type: object
      additionalProperties: false
      required: [credentialId, tool, targetType, targetId, argumentsSha256, expectedResourceVersion, summary]
      properties:
        credentialId: { type: string, pattern: '^key_[A-Za-z0-9]+$' }
        tool:
          type: string
          enum: [configure_storefront, configure_route, change_route_price, publish_route]
        targetType: { type: string, enum: [seller, paid_route] }
        targetId:
          type: string
          pattern: '^(?:sel|rte)_[A-Za-z0-9]+$'
          description: Seller ID for storefront configuration or route creation; route ID for route mutation.
        argumentsSha256:
          allOf:
            - { $ref: '#/components/schemas/Sha256' }
          description: RFC 8785 canonical mutation arguments hashed with the agentpay.mcp-mutation.v1 domain separator, excluding the grant and idempotency key.
        expectedResourceVersion: { type: integer, minimum: 1 }
        summary:
          type: string
          minLength: 10
          maxLength: 500
          description: Redacted text displayed to the seller; the binding fields, not this text alone, define authority.
    McpConfirmationGrantCreated:
      type: object
      additionalProperties: false
      required: [confirmationGrantId, confirmationGrant, sellerId, credentialId, tool, targetType, targetId, argumentsSha256, expectedResourceVersion, issuedAt, expiresAt]
      properties:
        confirmationGrantId: { type: string, pattern: '^mcg_[A-Za-z0-9]+$' }
        confirmationGrant:
          type: string
          minLength: 43
          maxLength: 512
          pattern: '^mcg1\.mcg_[A-Za-z0-9]+\.[A-Za-z0-9_-]{43,}$'
          description: Opaque 256-bit one-time secret. AgentPay stores only a keyed digest and never logs this value.
        sellerId: { type: string, pattern: '^sel_[A-Za-z0-9]+$' }
        credentialId: { type: string, pattern: '^key_[A-Za-z0-9]+$' }
        tool:
          type: string
          enum: [configure_storefront, configure_route, change_route_price, publish_route]
        targetType: { type: string, enum: [seller, paid_route] }
        targetId: { type: string, pattern: '^(?:sel|rte)_[A-Za-z0-9]+$' }
        argumentsSha256: { $ref: '#/components/schemas/Sha256' }
        expectedResourceVersion: { type: integer, minimum: 1 }
        issuedAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time, description: Exclusive boundary no more than five minutes after issuedAt. }
    CreateBrowserPurchaseSessionRequest:
      type: object
      additionalProperties: false
      required: [requestBodyHash, maximumAmount]
      properties:
        requestBodyHash: { $ref: '#/components/schemas/Sha256' }
        maximumAmount: { $ref: '#/components/schemas/AtomicAmount' }
    BrowserPurchaseSessionCreated:
      type: object
      additionalProperties: false
      required: [purchaseSessionId, sellerId, routeId, productSlug, purchaseChannel, commerceExpiresAt, accessExpiresAt]
      properties:
        purchaseSessionId: { type: string, pattern: '^bps_[A-Za-z0-9]+$' }
        sellerId: { type: string, pattern: '^sel_[A-Za-z0-9]+$' }
        routeId: { type: string, pattern: '^rte_[A-Za-z0-9]+$' }
        productSlug: { type: string, pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$' }
        purchaseChannel: { type: string, const: browser }
        commerceExpiresAt: { type: string, format: date-time, description: 'Exclusive boundary for intent creation, challenge issuance, verification, and settlement.' }
        accessExpiresAt: { type: string, format: date-time, description: 'Exclusive boundary for transaction, receipt, evidence, and dispute access; initially commerce expiry and extended after finalized payment according to the 30-day remediation rule.' }
    BrowserPurchaseRecoveryChallengeRequest:
      type: object
      additionalProperties: false
      required: [network, address]
      properties:
        network: { type: string, minLength: 1, maxLength: 80 }
        address: { type: string, minLength: 1, maxLength: 256 }
    BrowserPurchaseRecoveryChallenge:
      type: object
      additionalProperties: false
      required: [challengeId, network, address, message, expiresAt]
      properties:
        challengeId: { type: string, pattern: '^bpr_[A-Za-z0-9]+$' }
        network: { type: string, minLength: 1, maxLength: 80 }
        address: { type: string, minLength: 1, maxLength: 256 }
        message: { type: string, minLength: 1, maxLength: 2048 }
        expiresAt: { type: string, format: date-time }
    RecoverBrowserPurchaseRequest:
      type: object
      additionalProperties: false
      required: [challengeId, network, address, proof]
      properties:
        challengeId: { type: string, pattern: '^bpr_[A-Za-z0-9]+$' }
        network: { type: string, minLength: 1, maxLength: 80 }
        address: { type: string, minLength: 1, maxLength: 256 }
        proof: { type: string, minLength: 1, maxLength: 4096 }
    CreateSellerRequest:
      type: object
      additionalProperties: false
      required: [name, slug, upstreamBaseUrl]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        slug: { type: string, pattern: '^[a-z0-9-]{3,48}$' }
        upstreamBaseUrl: { type: string, format: uri }
    ActivateSellerServiceRequest:
      type: object
      additionalProperties: false
      required: [expectedVersion]
      properties:
        expectedVersion: { type: integer, minimum: 1 }

    IntegrationVerificationCheck:
      type: object
      additionalProperties: false
      required: [name, passed, message]
      properties:
        name:
          type: string
          enum: [endpoint_reachability, signed_exchange, schema_contract, fulfillment_readiness, payment_gating, replay_idempotency]
        passed: { type: boolean }
        message: { type: string, minLength: 1, maxLength: 240 }
    IntegrationVerificationResult:
      type: object
      additionalProperties: false
      required: [schemaVersion, sellerId, routeId, routeVersion, completedAt, valid, checks]
      properties:
        schemaVersion: { type: string, const: agentpay.sandbox.v2 }
        sellerId: { type: string, pattern: '^sel_[A-Za-z0-9]+$' }
        routeId: { type: string, pattern: '^rte_[A-Za-z0-9]+$' }
        routeVersion: { type: integer, minimum: 1 }
        completedAt: { type: string, format: date-time }
        valid: { type: boolean }
        checks:
          type: array
          minItems: 6
          maxItems: 6
          items: { $ref: '#/components/schemas/IntegrationVerificationCheck' }
    OnboardingStep:
      type: object
      additionalProperties: false
      required: [name, status, blocking, message]
      properties:
        name: { type: string, enum: [account_verified, storefront_created, service_connection_verified, subscription_active, payment_destination_verified, project_key_created, connector_verified, product_configured, integration_verification, storefront_previewed] }
        status: { type: string, enum: [complete, incomplete, blocked] }
        blocking: { type: boolean }
        message: { type: string }
    PublicationReadiness:
      type: object
      additionalProperties: false
      required: [allowed, blockers]
      properties:
        allowed: { type: boolean }
        blockers:
          type: array
          items: { type: string, enum: [account_verified, storefront_created, service_connection_verified, subscription_active, payment_destination_verified, project_key_created, connector_verified, product_configured, integration_verification, storefront_previewed] }
    SellerOnboarding:
      type: object
      additionalProperties: false
      required: [sellerId, complete, steps, publication, version]
      properties:
        sellerId: { type: [string, 'null'], pattern: '^sel_[A-Za-z0-9]+$' }
        complete: { type: boolean }
        currentStep: { type: string }
        steps:
          type: array
          items: { $ref: '#/components/schemas/OnboardingStep' }
        publication: { $ref: '#/components/schemas/PublicationReadiness' }
        integrationVerification: { $ref: '#/components/schemas/IntegrationVerificationResult' }
        version: { type: integer, minimum: 0 }
        updatedAt: { type: [string, 'null'], format: date-time }
    ProductSummary:
      type: object
      additionalProperties: false
      required: [total, draft, published, paused, archived, emergencyDisabled]
      properties:
        total: { type: integer, minimum: 0 }
        draft: { type: integer, minimum: 0 }
        published: { type: integer, minimum: 0 }
        paused: { type: integer, minimum: 0 }
        archived: { type: integer, minimum: 0 }
        emergencyDisabled: { type: integer, minimum: 0 }
    TransactionSummary:
      type: object
      additionalProperties: false
      required: [total, live, test, pending, abandoned, fulfilled, failed, disputed]
      properties:
        total: { type: integer, minimum: 0, maximum: 1000 }
        live: { type: integer, minimum: 0 }
        test: { type: integer, minimum: 0 }
        pending: { type: integer, minimum: 0 }
        abandoned: { type: integer, minimum: 0 }
        fulfilled: { type: integer, minimum: 0 }
        failed: { type: integer, minimum: 0 }
        disputed: { type: integer, minimum: 0 }
    EvidenceSummary:
      type: object
      additionalProperties: false
      required: [transactionChains, eventCount]
      properties:
        transactionChains: { type: integer, minimum: 0, maximum: 1000 }
        eventCount: { type: integer, minimum: 0 }
    WebhookSummary:
      type: object
      additionalProperties: false
      required: [subscriptions, activeSubscriptions, pendingDeliveries, deadLetterDeliveries]
      properties:
        subscriptions: { type: integer, minimum: 0 }
        activeSubscriptions: { type: integer, minimum: 0 }
        pendingDeliveries: { type: integer, minimum: 0, maximum: 100 }
        deadLetterDeliveries: { type: integer, minimum: 0, maximum: 100 }
    CredentialSummary:
      type: object
      additionalProperties: false
      required: [total, active, expired, revoked]
      properties:
        total: { type: integer, minimum: 0 }
        active: { type: integer, minimum: 0 }
        expired: { type: integer, minimum: 0 }
        revoked: { type: integer, minimum: 0 }
    ProviderPlanState:
      type: object
      additionalProperties: false
      required: [provider, portalAvailable]
      properties:
        provider: { type: string, enum: [stripe, local, operator] }
        customerId: { type: string }
        subscriptionId: { type: string }
        priceId: { type: string }
        portalAvailable: { type: boolean }
    BillingSummary:
      type: object
      additionalProperties: false
      required: [provider, portalAvailable, unavailable]
      properties:
        entitlement: { $ref: '#/components/schemas/SellerEntitlement' }
        plan: { $ref: '#/components/schemas/PlanDefinition' }
        provider: { $ref: '#/components/schemas/ProviderPlanState' }
        portalAvailable: { type: boolean }
        unavailable: { type: boolean }
    SellerSettings:
      type: object
      additionalProperties: false
      required: [supportEmail, securityNotificationEmail, webhookFailureNotifications, version, updatedAt]
      properties:
        supportEmail: { type: string, format: email }
        securityNotificationEmail: { type: string, format: email }
        webhookFailureNotifications: { type: boolean }
        version: { type: integer, minimum: 1 }
        updatedAt: { type: string, format: date-time }
    UpdateSellerSettingsRequest:
      type: object
      additionalProperties: false
      required: [supportEmail, securityNotificationEmail, webhookFailureNotifications, expectedVersion]
      properties:
        supportEmail: { type: string, format: email }
        securityNotificationEmail: { type: string, format: email }
        webhookFailureNotifications: { type: boolean }
        expectedVersion: { type: integer, minimum: 1 }
    CreateBillingPortalSessionRequest:
      type: object
      additionalProperties: false
      required: [returnUrl]
      properties:
        returnUrl: { type: string, format: uri }
    BillingPortalSession:
      type: object
      additionalProperties: false
      required: [url, expiresAt]
      properties:
        url: { type: string, format: uri }
        expiresAt: { type: string, format: date-time }
    SellerDashboardOverview:
      type: object
      additionalProperties: false
      required: [seller, onboarding, products, transactions, evidence, webhooks, billing, credentials, settings]
      properties:
        seller: { $ref: '#/components/schemas/Seller' }
        onboarding: { $ref: '#/components/schemas/SellerOnboarding' }
        products: { $ref: '#/components/schemas/ProductSummary' }
        transactions: { $ref: '#/components/schemas/TransactionSummary' }
        evidence: { $ref: '#/components/schemas/EvidenceSummary' }
        webhooks: { $ref: '#/components/schemas/WebhookSummary' }
        billing: { $ref: '#/components/schemas/BillingSummary' }
        credentials: { $ref: '#/components/schemas/CredentialSummary' }
        settings: { $ref: '#/components/schemas/SellerSettings' }
    Seller:
      type: object
      required: [sellerId, name, slug, upstreamBaseUrl, status, createdAt, updatedAt, version]
      properties:
        sellerId: { type: string }
        name: { type: string }
        slug: { type: string }
        upstreamBaseUrl: { type: string, format: uri }
        status: { type: string, enum: [draft, active, suspended] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        version: { type: integer, minimum: 1 }
    PlanLimits:
      type: object
      additionalProperties: false
      required: [apiRequestsPerMonth, mcpOperationsPerMonth, publishedRoutes, webhookSubscriptions, webhookDeliveriesPerMonth, analyticsWindowDays, evidenceRetentionDays]
      properties:
        apiRequestsPerMonth: { type: integer, minimum: 1 }
        mcpOperationsPerMonth: { type: integer, minimum: 1 }
        publishedRoutes: { type: integer, minimum: 1 }
        webhookSubscriptions: { type: integer, minimum: 1 }
        webhookDeliveriesPerMonth: { type: integer, minimum: 1 }
        analyticsWindowDays: { type: integer, minimum: 1 }
        evidenceRetentionDays: { type: integer, minimum: 1 }
    PlanFeatures:
      type: object
      additionalProperties: false
      required: [webhooks, advancedAnalytics, prioritySupport]
      properties:
        webhooks: { type: boolean }
        advancedAnalytics: { type: boolean }
        prioritySupport: { type: boolean }
    PlanDefinition:
      type: object
      additionalProperties: false
      required: [planId, planVersion, displayName, limits, features]
      properties:
        planId: { type: string, enum: [starter, growth, scale] }
        planVersion: { type: integer, const: 1 }
        displayName: { type: string }
        limits: { $ref: '#/components/schemas/PlanLimits' }
        features: { $ref: '#/components/schemas/PlanFeatures' }
    SellerEntitlement:
      type: object
      additionalProperties: false
      required: [sellerId, planId, planVersion, status, billingPeriodStart, billingPeriodEnd, accessEndsAt, cancelAtPeriodEnd, entitlementEpoch, source, sourceRevision, credentialRotationRequired, networkAccess, dashboardAccess, assignedAt, updatedAt, version]
      properties:
        sellerId: { type: string, pattern: '^sel_[A-Za-z0-9]+$' }
        planId: { type: string, enum: [starter, growth, scale] }
        planVersion: { type: integer, const: 1 }
        status: { type: string, enum: [active, grace, suspended, cancelled, closed] }
        billingPeriodStart: { type: string, format: date-time }
        billingPeriodEnd: { type: string, format: date-time }
        accessEndsAt: { type: string, format: date-time, description: Exclusive UTC authorization boundary. }
        graceEndsAt: { type: [string, 'null'], format: date-time }
        cancelAtPeriodEnd: { type: boolean }
        entitlementEpoch: { type: integer, minimum: 1 }
        source: { type: string, enum: [billing_provider, operator, local] }
        sourceRevision: { type: string, minLength: 1, maxLength: 256 }
        statusReason:
          type: [string, 'null']
          enum: [payment_failed, payment_action_required, cancellation_requested, cancelled, administrative, fraud_quarantine, account_closed, provider_incomplete, null]
        credentialRotationRequired: { type: boolean }
        networkAccess: { type: string, enum: [enabled, blocked], description: Enabled only for active status while current UTC time is before accessEndsAt and no quarantine applies. }
        dashboardAccess: { type: string, enum: [full, recovery_read_only, closed] }
        provider: { type: string, enum: [stripe, local, operator] }
        lastReconciledAt: { type: [string, 'null'], format: date-time }
        assignedAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        version: { type: integer, minimum: 1 }
    SellerPlanResponse:
      type: object
      additionalProperties: false
      required: [assignment, plan]
      properties:
        assignment: { $ref: '#/components/schemas/SellerEntitlement' }
        plan: { $ref: '#/components/schemas/PlanDefinition' }
    InvoiceLineItem:
      type: object
      additionalProperties: false
      required: [meterName, planId, planVersion, quantity]
      properties:
        meterName: { type: string, enum: [successful_transaction] }
        planId: { type: string, enum: [starter, growth, scale] }
        planVersion: { type: integer, const: 1 }
        quantity: { type: integer, minimum: 1 }
    InvoiceExport:
      type: object
      additionalProperties: false
      required: [schemaVersion, sellerId, periodStart, periodEnd, generatedAt, lineItems]
      properties:
        schemaVersion:
          type: string
          enum: ['1', '2']
          description: Current M7 exports use version 1; M7.1 launch writers use version 2 and readers accept both during migration.
        sellerId: { type: string, pattern: '^sel_[A-Za-z0-9]+$' }
        periodStart: { type: string, format: date-time }
        periodEnd: { type: string, format: date-time }
        generatedAt: { type: string, format: date-time }
        lineItems:
          type: array
          items: { $ref: '#/components/schemas/InvoiceLineItem' }
    AuditEvent:
      type: object
      additionalProperties: false
      required: [auditEventId, sellerId, actorType, actorId, action, targetType, targetId, outcome, requestId, changedFields, occurredAt]
      properties:
        auditEventId: { type: string, pattern: '^aud_[A-Za-z0-9]+$' }
        sellerId: { type: string, pattern: '^sel_[A-Za-z0-9]+$' }
        actorType: { type: string, enum: [seller_user, integration_credential, administrator, system] }
        actorId: { type: string, minLength: 1, maxLength: 256 }
        action:
          type: string
