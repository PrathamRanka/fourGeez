  /v1/sellers/{sellerId}/disputes/{disputeId}/refund-records:
    post:
      summary: Record a seller-completed external refund
      description: |
        Records, but does not execute, one full manual refund for a
        refund-recommended dispute whose transaction is finalized. The
        authenticated seller, dispute, transaction, amount, asset, and network
        are revalidated before the append-only record is created. An exact
        Idempotency-Key replay returns the original 201 response; reuse with a
        changed request returns 409 idempotency_conflict. A cross-seller
        dispute is concealed as 404 not_found.
      tags: [Sellers, Disputes]
      operationId: createManualRefundRecord
      security: [{ sellerBearer: [] }]
      parameters:
        - { $ref: '#/components/parameters/SellerId' }
        - { $ref: '#/components/parameters/DisputeId' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateManualRefundRecordRequest' }
      responses:
        '201':
          description: Manual refund record created, or the exact prior result replayed
          headers:
            Cache-Control: { schema: { type: string, const: no-store } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ManualRefundRecord' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/PermissionDenied' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/DependencyUnavailable' }
  /v1/sellers/{sellerId}/disputes/{disputeId}/refund-records/current:
