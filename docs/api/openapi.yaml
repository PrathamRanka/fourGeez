openapi: 3.1.0
info:
  title: AgentPay API
  version: 0.10.0
  description: |
    Version 0.10.0 adds deterministic external-buyer x402 compatibility
    detection and explicit buyer-agent authentication/header metadata without
    adding an AgentPay-operated buyer runtime.
    Seller commerce gateway, transaction, and dispute API. AgentPay is a working name.
    Version 0.9.0 adds authoritative pre-payment validation against each
    published route inputSchema, bounded field-level validation failures, and
    deterministic paid-but-unfulfilled recovery. A seller
    may mark only an HTTP 400 or 422 response as side-effect-free with
    X-AgentPay-Retry-Safe: corrected-input; the buyer may then resubmit the
    same payment proof once with corrected input. Verification and settlement
    are not repeated. Ambiguous transport failures require seller review, and
    refunds remain seller-reported unless a future transfer adapter is added.
    Version 0.8.0 removed the seller-callable onboarding purchase action while
    preserving public buyer storefront and external buyer-agent commerce.
    Version 0.7.0 extended the locked M7.1 production target with EXT-001 public
    capability and deterministic product-directory contracts plus the EXT-004
    payment-capability and recovery extension and the seller-first EXT-005
    versioned product-schema contract. Seller onboarding consumes an
    authoritative route-version-bound non-payment integration verification
    result; no seller-funded purchase is required. AgentPay-operated buyer execution, A2A,
    and negotiation remain disabled V2 work. The Go runtime implements these
    endpoints in the development preview. Production deployment must not
    advertise them before every authorization, persistence, infrastructure,
    and release precondition is verified.
    Seller project keys are proprietary bootstrap credentials accepted only by
    POST /v1/integration-access-tokens; this is not an OAuth token endpoint.
    Lean V1 project-key installations use the required AgentPay connector.
    Direct remote MCP OAuth clients are deferred. Ordinary MCP requests use
    short-lived ES256 access tokens. Browser
    purchase sessions and buyer-agent keys are distinct from seller credentials.
    Buyer-side multi-person approval is deferred and disabled for Lean V1. The
    fixed seller quote, buyer maximum, and wallet authorization form the active
    buyer consent boundary; approval endpoints, tokens, cookies, WebSockets,
    and HTTP 428 are not part of this contract.
    Production MCP commercial mutations additionally require a one-time grant
    issued through the authenticated seller browser/BFF boundary; caller-
    asserted confirmation fields are development compatibility only.
  x-agentpay-contract-stage: target-state
  x-agentpay-runtime-baseline: m7.1-plus-ext-001-ext-004-and-ext-005-development-preview
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
  - url: https://{apiHost}
    description: Environment-specific API Gateway origin
    variables:
      apiHost:
        default: api.agentpay.invalid
        description: Replace with the deployed API Gateway custom domain.
tags:
  - name: Sellers
    description: Seller onboarding, route configuration, and transaction views.
  - name: Integrations
    description: Seller-scoped credentials used by MCP and coding-agent integrations.
  - name: Authorization
    description: Project-key bootstrap, public keys, and browser purchase sessions.
  - name: Settlement
    description: Seller payment destinations and reconciliation configuration.
  - name: Storefront
    description: Public machine-readable discovery documents.
  - name: Intents
    description: Immutable purchase proposals evaluated before payment.
  - name: Transactions
    description: Payment, delivery, and evidence status.
  - name: Billing
    description: Seller plans, entitlements, usage, and invoice exports.
  - name: Audit
    description: Immutable seller-visible control-plane change history.
  - name: Disputes
    description: Deterministic dispute classification and review.
  - name: Proxy
    description: x402-protected forwarding to configured seller APIs.
  - name: Payments
    description: Runtime-enabled payment capabilities and deterministic recovery semantics.
paths:
  /.well-known/agentpay:
    get:
      summary: Get the AgentPay public capability manifest
      description: Stable machine-readable entry point for public discovery. This document advertises supported discovery and commerce capabilities but never authorizes a transaction.
      tags: [Storefront]
      operationId: getAgentPayManifest
      security: []
      responses:
        '200':
          description: Current public AgentPay capabilities and discovery endpoints
          headers:
            Cache-Control: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgentPayPlatformManifest' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/DependencyUnavailable' }
  /.well-known/jwks.json:
    get:
      summary: Get AgentPay capability verification keys
      tags: [Authorization]
      operationId: getCapabilityJwks
      security: []
      responses:
        '200':
          description: Current and overlapping-rotation ES256 public keys
          headers:
            Cache-Control: { schema: { type: string } }
          content:
            application/jwk-set+json:
              schema: { $ref: '#/components/schemas/JsonWebKeySet' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/DependencyUnavailable' }
  /v1/integration-access-tokens:
    post:
      summary: Exchange a seller project key for a short-lived MCP access token
      description: Proprietary AgentPay bootstrap exchange; this endpoint is not OAuth and accepts no OAuth grant type. Immediately before signing, the server reloads the current credential and seller entitlement, requires active status and now strictly before accessEndsAt, and verifies the credential and entitlement epochs. Suspension or cancellation therefore prevents capability minting even if a caller keeps an official or modified connector running.
      tags: [Authorization, Integrations]
      operationId: exchangeProjectKey
      security: [{ projectKey: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/IntegrationAccessTokenRequest' }
      responses:
        '200':
          description: Short-lived seller-scoped MCP access capability
          headers:
            Cache-Control: { schema: { type: string, const: no-store } }
            Pragma: { schema: { type: string, const: no-cache } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IntegrationAccessTokenResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/PermissionDenied' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/DependencyUnavailable' }
  /v1/sellers/{sellerId}/mcp-confirmation-grants:
    post:
      summary: Confirm one exact seller-visible MCP commercial mutation
      description: Seller browser/BFF operation only. Returns an opaque one-time grant bound to the authenticated seller, selected credential, exact tool, target, canonical arguments hash, expected resource version, and a maximum five-minute lifetime. Project keys and MCP bearer tokens cannot call this endpoint. Issuing the same binding again atomically revokes any earlier unconsumed grant for that binding.
      tags: [Authorization, Integrations]
      operationId: createMcpConfirmationGrant
      security: [{ sellerBearer: [] }]
      parameters:
        - { $ref: '#/components/parameters/SellerId' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateMcpConfirmationGrantRequest' }
      responses:
        '201':
          description: One-time confirmation grant returned only in this response
          headers:
            Cache-Control: { schema: { type: string, const: no-store } }
            Pragma: { schema: { type: string, const: no-cache } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/McpConfirmationGrantCreated' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/PermissionDenied' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/DependencyUnavailable' }
  /v1/billing/providers/stripe/webhooks:
    post:
      summary: Accept and durably enqueue a Stripe Billing event
      description: Verifies Stripe-Signature against the exact raw body. Duplicate event IDs with the same payload hash return success; events are reconciled asynchronously and never applied in arrival order.
      tags: [Billing]
      operationId: acceptStripeBillingEvent
      security: [{ stripeWebhookSignature: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        '204': { description: Authenticated event durably stored or exact duplicate already stored }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/DependencyUnavailable' }
  /health:
    get:
      summary: Check service health
      operationId: getHealth
      security: []
      responses:
        '200':
          description: Service is running
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, const: ok }
        '503':
          description: A required dependency is unavailable
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429':
          description: Health endpoint rate limit exceeded
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /v1/me/seller:
    get:
      summary: Get the seller owned by the authenticated account
      description: Resolves the seller only from the verified seller subject. Query parameters and request bodies cannot select or override seller ownership.
      tags: [Sellers]
      operationId: getCurrentSeller
      security: [{ sellerBearer: [] }]
      responses:
        '200':
          description: Current seller storefront without private ownership or secret fields
          headers:
            Cache-Control: { schema: { type: string, const: no-store } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Seller' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/DependencyUnavailable' }
  /v1/me/session:
    delete:
      summary: Revoke the authenticated seller session
      description: Revokes the current Cognito token family or local equivalent through its hashed session identifier until the access-token expiry. Raw bearer tokens are never persisted.
      tags: [Authorization, Sellers]
      operationId: revokeCurrentSellerSession
      security: [{ sellerBearer: [] }]
      responses:
        '204':
          description: Current seller session revoked
          headers:
            Cache-Control: { schema: { type: string, const: no-store } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/DependencyUnavailable' }
  /v1/me/onboarding:
    get:
      summary: Get server-authoritative onboarding and publication prerequisites
      tags: [Sellers]
      operationId: getCurrentSellerOnboarding
      security: [{ sellerBearer: [] }]
      responses:
        '200':
          description: Resumable onboarding state derived from current authoritative seller records
          headers:
            Cache-Control: { schema: { type: string, const: no-store } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SellerOnboarding' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/DependencyUnavailable' }
  /v1/me/dashboard:
    get:
      summary: Get the current seller operating overview
      tags: [Sellers]
      operationId: getCurrentSellerDashboard
      security: [{ sellerBearer: [] }]
      responses:
        '200':
          description: Bounded product, transaction, evidence, webhook, billing, credential, and settings summaries
          headers:
            Cache-Control: { schema: { type: string, const: no-store } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SellerDashboardOverview' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/DependencyUnavailable' }
  /v1/me/dashboard/products:
    get:
      summary: Get current seller product counts
      tags: [Sellers]
      operationId: getCurrentSellerProductSummary
      security: [{ sellerBearer: [] }]
      responses:
        '200': { description: Product lifecycle counts, content: { application/json: { schema: { $ref: '#/components/schemas/ProductSummary' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/DependencyUnavailable' }
  /v1/me/dashboard/transactions:
    get:
      summary: Get current seller transaction counts
      tags: [Sellers]
      operationId: getCurrentSellerTransactionSummary
      security: [{ sellerBearer: [] }]
      responses:
        '200': { description: Bounded transaction status counts, content: { application/json: { schema: { $ref: '#/components/schemas/TransactionSummary' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/DependencyUnavailable' }
  /v1/me/dashboard/evidence:
    get:
      summary: Get current seller evidence counts
      tags: [Sellers]
      operationId: getCurrentSellerEvidenceSummary
      security: [{ sellerBearer: [] }]
      responses:
        '200': { description: Bounded evidence-chain counts, content: { application/json: { schema: { $ref: '#/components/schemas/EvidenceSummary' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/DependencyUnavailable' }
  /v1/me/dashboard/webhooks:
    get:
      summary: Get current seller webhook health counts
      tags: [Sellers]
      operationId: getCurrentSellerWebhookSummary
      security: [{ sellerBearer: [] }]
      responses:
        '200': { description: Subscription and bounded delivery-health counts, content: { application/json: { schema: { $ref: '#/components/schemas/WebhookSummary' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/DependencyUnavailable' }
  /v1/me/dashboard/billing:
    get:
      summary: Get current seller entitlement and Stripe plan state
      description: Read-only seller projection. While Stripe checkout is disabled, no seller-authenticated API operation can grant or reactivate launch entitlement; provisioning is an audited environment-bound operator workflow outside this HTTP API.
      tags: [Billing]
      operationId: getCurrentSellerBillingSummary
      security: [{ sellerBearer: [] }]
      responses:
        '200': { description: Authoritative entitlement plus provider portal availability, content: { application/json: { schema: { $ref: '#/components/schemas/BillingSummary' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/DependencyUnavailable' }
  /v1/me/dashboard/credentials:
    get:
      summary: Get current seller project-key counts
      tags: [Integrations]
      operationId: getCurrentSellerCredentialSummary
      security: [{ sellerBearer: [] }]
      responses:
        '200': { description: Redacted credential lifecycle counts, content: { application/json: { schema: { $ref: '#/components/schemas/CredentialSummary' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/DependencyUnavailable' }
  /v1/me/settings:
    get:
      summary: Get current seller operating settings
      tags: [Sellers]
      operationId: getCurrentSellerSettings
      security: [{ sellerBearer: [] }]
      responses:
        '200': { description: Seller operating settings, content: { application/json: { schema: { $ref: '#/components/schemas/SellerSettings' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/DependencyUnavailable' }
    patch:
      summary: Update current seller operating settings
      tags: [Sellers]
      operationId: updateCurrentSellerSettings
      security: [{ sellerBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateSellerSettingsRequest' }
      responses:
        '200': { description: Updated seller settings, content: { application/json: { schema: { $ref: '#/components/schemas/SellerSettings' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/DependencyUnavailable' }
  /v1/me/billing/portal-sessions:
    post:
      summary: Create a short-lived Stripe customer portal session for the current seller
      tags: [Billing]
      operationId: createCurrentSellerBillingPortalSession
      security: [{ sellerBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateBillingPortalSessionRequest' }
      responses:
        '201':
          description: Short-lived provider-hosted billing portal session
          headers:
            Cache-Control: { schema: { type: string, const: no-store } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BillingPortalSession' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/DependencyUnavailable' }
  /v1/sellers:
    post:
      summary: Create a seller storefront
      tags: [Sellers]
      operationId: createSeller
      security: [{ sellerBearer: [] }]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateSellerRequest' }
      responses:
        '201': { $ref: '#/components/responses/SellerCreated' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/PermissionDenied' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/DependencyUnavailable' }
  /v1/sellers/{sellerId}/service-activation:
    post:
      summary: Enable ES256 AgentPay execution-capability verification for a seller HTTPS origin
      description: Activates an owned draft seller for coding-agent integration without creating or revealing a shared signing secret. Publication remains blocked until the cloud sandbox verifies the configured endpoint.
      tags: [Sellers]
      operationId: activateSellerService
      security: [{ sellerBearer: [] }]
      parameters:
        - { $ref: '#/components/parameters/SellerId' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ActivateSellerServiceRequest' }
      responses:
        '200':
          description: Seller activated for ES256 execution-capability integration
          headers:
            Cache-Control: { schema: { type: string, const: no-store } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Seller' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/DependencyUnavailable' }

  /v1/plans:
    get:
      summary: List versioned seller plans and operational entitlements
      tags: [Billing]
      operationId: listSellerPlans
      security: []
      responses:
        '200':
          description: Immutable V1 seller plan catalog
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/PlanDefinition' }
        '429':
          description: Plan catalog rate limit exceeded
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '503': { $ref: '#/components/responses/DependencyUnavailable' }
  /v1/sellers/{sellerId}/plan:
    get:
      summary: Get the authenticated seller plan assignment
      tags: [Billing]
      operationId: getSellerPlan
      security: [{ sellerBearer: [] }]
      parameters:
        - { $ref: '#/components/parameters/SellerId' }
      responses:
        '200':
          description: Seller assignment and immutable plan definition
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SellerPlanResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/PermissionDenied' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/DependencyUnavailable' }
  /v1/sellers/{sellerId}/invoice-export:
    get:
      summary: Export immutable AgentPay usage for external invoicing
      tags: [Billing]
      operationId: getSellerInvoiceExport
      security: [{ sellerBearer: [] }]
      parameters:
        - { $ref: '#/components/parameters/SellerId' }
        - name: from
          in: query
          required: true
          schema: { type: string, format: date-time }
        - name: to
          in: query
          required: true
          schema: { type: string, format: date-time }
      responses:
        '200':
          description: Non-monetary usage statement for a billing adapter
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InvoiceExport' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/PermissionDenied' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/DependencyUnavailable' }
  /v1/sellers/{sellerId}/audit-events:
    get:
      summary: List immutable seller audit history
      tags: [Audit]
      operationId: listSellerAuditEvents
      security: [{ sellerBearer: [] }]
      parameters:
        - { $ref: '#/components/parameters/SellerId' }
        - { $ref: '#/components/parameters/AuditLimit' }
        - { $ref: '#/components/parameters/AuditCursor' }
      responses:
        '200':
          description: Newest-first bounded seller audit page
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuditEventPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/PermissionDenied' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/DependencyUnavailable' }
  /v1/sellers/{sellerId}/routes:
    get:
      summary: List paid routes owned by a seller
      tags: [Sellers]
      operationId: listPaidRoutes
      security: [{ sellerBearer: [] }]
      parameters:
        - { $ref: '#/components/parameters/SellerId' }
      responses:
        '200':
          description: Seller-owned paid routes
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/PaidRoute' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/PermissionDenied' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/DependencyUnavailable' }
    post:
      summary: Add a paid route to a seller
      tags: [Sellers]
      operationId: createPaidRoute
      security: [{ sellerBearer: [] }]
      parameters:
        - { $ref: '#/components/parameters/SellerId' }
