        - { $ref: '#/components/schemas/PurchaseReceiptV2' }
      discriminator:
        propertyName: schemaVersion
        mapping:
          '1': '#/components/schemas/PurchaseReceiptV1'
          '2': '#/components/schemas/PurchaseReceiptV2'
    PurchaseReceiptV1:
      type: object
      additionalProperties: false
      required: [schemaVersion, transaction, evidence]
      properties:
        schemaVersion: { type: string, const: '1' }
        transaction:
          type: object
          additionalProperties: false
          required: [transactionId, intentId, sellerId, routeId, buyerId, status, amount, asset, network, paymentFinality, paymentReference, createdAt, updatedAt]
          properties:
            transactionId: { type: string, pattern: '^txn_[A-Za-z0-9]+$' }
            intentId: { type: string, pattern: '^int_[A-Za-z0-9]+$' }
            sellerId: { type: string, pattern: '^sel_[A-Za-z0-9]+$' }
            routeId: { type: string, pattern: '^rte_[A-Za-z0-9]+$' }
            buyerId: { type: string }
            status: { type: string, enum: [PAYMENT_VERIFIED, FORWARDED, FULFILLED, FAILED, DISPUTED, REFUND_RECOMMENDED, RESOLVED] }
            amount: { $ref: '#/components/schemas/AtomicAmount' }
            asset: { type: string }
            network: { type: string }
            paymentFinality: { type: string, const: finalized }
            paymentReference: { type: string, minLength: 1, maxLength: 512 }
            reconciledAt: { type: [string, 'null'], format: date-time }
            upstreamStatus: { type: [integer, 'null'] }
            responseHash: { oneOf: [{ $ref: '#/components/schemas/Sha256' }, { type: 'null' }] }
            failureCode: { type: [string, 'null'] }
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }
        evidence: { $ref: '#/components/schemas/ReceiptEvidence' }
    PurchaseReceiptV2:
      type: object
      additionalProperties: false
      required: [schemaVersion, transaction, evidence]
      properties:
        schemaVersion: { type: string, const: '2' }
        transaction:
          type: object
          additionalProperties: false
          required: [transactionId, intentId, sellerId, routeId, buyerId, productDisplayName, productSlug, purchaseChannel, paymentRail, paymentDestinationId, status, amount, asset, network, paymentFinality, paymentReference, createdAt, updatedAt]
          properties:
            transactionId: { type: string, pattern: '^txn_[A-Za-z0-9]+$' }
            intentId: { type: string, pattern: '^int_[A-Za-z0-9]+$' }
            sellerId: { type: string, pattern: '^sel_[A-Za-z0-9]+$' }
            routeId: { type: string, pattern: '^rte_[A-Za-z0-9]+$' }
            buyerId: { type: string, description: Buyer-agent subject or browser:<purchaseSessionId>. }
            productDisplayName: { type: string, minLength: 1, maxLength: 120 }
            productSlug: { type: string, pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$' }
            purchaseChannel: { type: string, enum: [agent, browser] }
            paymentRail: { type: string, const: x402 }
            paymentDestinationId: { type: string, pattern: '^dst_[A-Za-z0-9]+$' }
            status: { type: string, enum: [PAYMENT_VERIFIED, FORWARDED, FULFILLED, FAILED, DISPUTED, REFUND_RECOMMENDED, RESOLVED] }
            amount: { $ref: '#/components/schemas/AtomicAmount' }
            asset: { type: string }
            network: { type: string }
            paymentFinality: { type: string, const: finalized }
            paymentReference: { type: string, minLength: 1, maxLength: 512 }
            reconciledAt: { type: [string, 'null'], format: date-time }
            upstreamStatus: { type: [integer, 'null'] }
            responseHash: { oneOf: [{ $ref: '#/components/schemas/Sha256' }, { type: 'null' }] }
            failureCode: { type: [string, 'null'] }
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }
        evidence: { $ref: '#/components/schemas/ReceiptEvidence' }
    ReceiptEvidence:
      type: object
      additionalProperties: false
      required: [verified, eventCount, rootEventHash, headEventHash, events]
      properties:
        verified: { type: boolean, const: true }
        eventCount: { type: integer, minimum: 1 }
        rootEventHash: { $ref: '#/components/schemas/Sha256' }
        headEventHash: { $ref: '#/components/schemas/Sha256' }
        events:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/EvidenceEvent' }
    PaymentReconciliation:
      type: object
      additionalProperties: false
      required: [stage, amount, asset, network]
      properties:
        stage: { type: string, enum: [challenged, verified, finalized, fulfilled, failed, disputed] }
        amount: { $ref: '#/components/schemas/AtomicAmount' }
        asset: { type: string }
        network: { type: string }
        paymentReference: { type: string, minLength: 1, maxLength: 512 }
        reconciledAt: { type: string, format: date-time }
    SalesAggregate:
      type: object
      additionalProperties: false
      required: [sellerId, bucketDate, asset, network, stage, transactionCount, amount, lastTransactionAt]
      properties:
        sellerId: { type: string, pattern: '^sel_[A-Za-z0-9]+$' }
        bucketDate: { type: string, format: date }
        asset: { type: string }
        network: { type: string }
        routeId: { type: string, pattern: '^rte_[A-Za-z0-9]+$' }
        stage: { type: string, enum: [challenged, verified, finalized, fulfilled, failed, disputed] }
        transactionCount: { type: integer, minimum: 0 }
        amount: { $ref: '#/components/schemas/AtomicAmount' }
        lastTransactionAt: { type: string, format: date-time }
    DashboardSummary:
      type: object
      additionalProperties: false
      required: [transactionCount, aggregates]
      properties:
        transactionCount: { type: integer, minimum: 0, maximum: 1000 }
        aggregates:
          type: array
          items: { $ref: '#/components/schemas/SalesAggregate' }
    EvidenceEvent:
      type: object
      required: [eventId, transactionId, sequence, eventType, actorType, payload, eventHash, kmsKeyId, kmsSignature, createdAt]
      properties:
        eventId: { type: string }
        transactionId: { type: string }
        sequence: { type: integer, minimum: 1 }
        eventType: { type: string }
        actorType: { type: string, enum: [system, seller, buyer, approver] }
        actorId: { type: [string, 'null'] }
        payload: { type: object }
        previousEventHash: { oneOf: [{ $ref: '#/components/schemas/Sha256' }, { type: 'null' }] }
        eventHash: { $ref: '#/components/schemas/Sha256' }
        kmsKeyId: { type: string }
        kmsSignature: { type: string }
        createdAt: { type: string, format: date-time }
    CreateDisputeRequest:
      type: object
      additionalProperties: false
      required: [transactionId, reason]
      properties:
        transactionId: { type: string }
        reason: { type: string, enum: [unauthorized, duplicate, wrong_amount, not_delivered, quality_or_output] }
        statement: { type: string, maxLength: 2000 }
    Dispute:
      type: object
      required: [disputeId, transactionId, reason, status, ruleVersion, classificationCode, explanation, createdAt]
      properties:
        disputeId: { type: string }
        transactionId: { type: string }
        reason: { type: string, enum: [unauthorized, duplicate, wrong_amount, not_delivered, quality_or_output] }
        status: { type: string, enum: [open, refund_recommended, seller_review, denied, resolved] }
        ruleVersion: { type: string, const: dispute-rules-v1 }
        classificationCode: { type: string }
        explanation: { type: string }
        createdAt: { type: string, format: date-time }
    CreateManualRefundRecordRequest:
      type: object
      additionalProperties: false
      required: [amount, asset, network, reference]
      properties:
        amount:
          $ref: '#/components/schemas/PositiveAtomicAmount'
        asset: { type: string, minLength: 1, maxLength: 160 }
        network: { type: string, minLength: 1, maxLength: 80 }
        reference:
          type: string
          minLength: 1
          maxLength: 512
          description: External refund, provider, or network reference. Leading/trailing whitespace is trimmed and control characters are rejected.
    ManualRefundRecord:
      type: object
      additionalProperties: false
      required: [disputeId, transactionId, sellerId, amount, asset, network, reference, verificationState, recordedBy, recordedAt]
      properties:
        disputeId: { type: string, pattern: '^dsp_[A-Za-z0-9]+$' }
        transactionId: { type: string, pattern: '^txn_[A-Za-z0-9]+$' }
        sellerId: { type: string, pattern: '^sel_[A-Za-z0-9]+$' }
        amount: { $ref: '#/components/schemas/PositiveAtomicAmount' }
        asset: { type: string, minLength: 1, maxLength: 160 }
        network: { type: string, minLength: 1, maxLength: 80 }
        reference: { type: string, minLength: 1, maxLength: 512 }
        verificationState: { type: string, const: seller_reported }
        recordedBy: { type: string, minLength: 1, maxLength: 256 }
        recordedAt: { type: string, format: date-time }
    AgentPayPlatformManifest:
      type: object
      additionalProperties: false
      required: [schemaVersion, name, status, canonicalOrigin, apiOrigin, directoryEndpoint, paymentCapabilitiesEndpoint, externalBuyerCompatibilityEndpoint, jwksUri, capabilities]
      properties:
        schemaVersion: { type: string, const: agentpay.platform.v2 }
        name: { type: string, const: AgentPay }
        status: { type: string, const: development_preview }
        canonicalOrigin: { type: string, format: uri }
        apiOrigin: { type: string, format: uri }
        directoryEndpoint: { type: string, format: uri }
        paymentCapabilitiesEndpoint: { type: string, format: uri }
        externalBuyerCompatibilityEndpoint: { type: string, format: uri }
        jwksUri: { type: string, format: uri }
        capabilities:
          type: object
          additionalProperties: false
          required: [buyerChannels, discovery, payments, sellerIntegration, externalBuyerCompatible, agentPayBuyerRuntime, a2aExecution, negotiation, ranking]
          properties:
            buyerChannels:
              type: array
              items: { type: string, enum: [agent, browser] }
              minItems: 2
              maxItems: 2
            discovery:
              type: object
              additionalProperties: false
              required: [publicDirectory, signedStorefrontManifests, signedProductDocuments, llmsText]
              properties:
                publicDirectory: { type: boolean, const: true }
                signedStorefrontManifests: { type: boolean, const: true }
                signedProductDocuments: { type: boolean, const: true }
                llmsText: { type: boolean, const: true }
            payments:
              type: array
              minItems: 1
              items:
                type: object
                additionalProperties: false
                required: [protocol, environment, exactPrice, network]
                properties:
                  protocol: { type: string, const: x402 }
                  environment: { type: string, const: testnet }
                  exactPrice: { type: boolean, const: true }
                  network: { type: string, const: 'eip155:84532' }
            sellerIntegration: { type: boolean, const: true }
            externalBuyerCompatible: { type: boolean, const: true }
            agentPayBuyerRuntime: { type: boolean, const: false }
            a2aExecution: { type: boolean, const: false }
            negotiation: { type: boolean, const: false }
            ranking: { type: boolean, const: false }
    PublicProductCapabilities:
      type: object
      additionalProperties: false
      required: [buyerChannels, payment, fulfillment]
      properties:
        buyerChannels:
          type: array
          items: { type: string, enum: [agent, browser] }
          minItems: 2
          maxItems: 2
        payment:
          type: object
          additionalProperties: false
          required: [protocol, environment, exactPrice, asset, network]
          properties:
            protocol: { type: string, const: x402 }
            environment: { type: string, const: testnet }
            exactPrice: { type: boolean, const: true }
            asset: { type: string, minLength: 1, maxLength: 160 }
            network: { type: string, minLength: 1, maxLength: 80 }
        fulfillment:
          type: object
          additionalProperties: false
          required: [mode, outputMimeType]
          properties:
            mode: { type: string, const: synchronous_https }
            outputMimeType: { type: string, minLength: 1, maxLength: 160 }
    PublicProductDirectoryItem:
      type: object
      additionalProperties: false
      required: [seller, product, capabilities]
      properties:
        seller:
          type: object
          additionalProperties: false
          required: [name, slug]
          properties:
            name: { type: string, minLength: 1, maxLength: 120 }
            slug: { type: string, pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$', minLength: 3, maxLength: 48 }
        product: { $ref: '#/components/schemas/PublicProduct' }
        capabilities: { $ref: '#/components/schemas/PublicProductCapabilities' }
    PublicProductDirectoryPage:
      type: object
      additionalProperties: false
      required: [schemaVersion, ordering, authoritativeForPurchase, items]
      properties:
        schemaVersion: { type: string, const: agentpay.directory.v1 }
        query: { type: string, maxLength: 131 }
        ordering: { type: string, const: lexical }
        authoritativeForPurchase: { type: boolean, const: false }
        items:
          type: array
          maxItems: 24
          items: { $ref: '#/components/schemas/PublicProductDirectoryItem' }
        nextCursor: { type: string, minLength: 1, maxLength: 2048 }
    StorefrontManifest:
      type: object
      additionalProperties: false
      required: [schemaVersion, sellerId, seller, availability, publicationRevision, issuedAt, expiresAt, canonicalOrigin, products]
      properties:
        schemaVersion: { type: string, const: agentpay.discovery.v1 }
        sellerId: { type: string, pattern: '^sel_[A-Za-z0-9]+$' }
        seller:
          type: object
          additionalProperties: false
          required: [name, slug]
          properties:
            name: { type: string }
            slug: { type: string }
        availability: { type: string, const: active }
        publicationRevision: { type: integer, minimum: 1 }
        issuedAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        canonicalOrigin: { type: string, format: uri }
        products:
          type: array
          items: { $ref: '#/components/schemas/PublicProduct' }
    PublicProduct:
      type: object
      additionalProperties: false
      required: [schemaVersion, sellerId, routeId, routeVersion, displayName, productSlug, description, mimeType, inputSchema, outputSchema, amount, asset, network, paymentProtocol, paymentScheme, availability, fulfillmentMode, fulfillmentTimeoutSeconds, updatedAt, authoritativeForPurchase, canonicalUrl, purchaseSessionEndpoint]
      properties:
        schemaVersion: { type: string, const: agentpay.product-contract.v1 }
        sellerId: { type: string, pattern: '^sel_[A-Za-z0-9]+$' }
        routeId: { type: string, pattern: '^rte_[A-Za-z0-9]+$' }
        routeVersion: { type: integer, minimum: 1 }
        displayName: { type: string, minLength: 1, maxLength: 120 }
        productSlug: { type: string, pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$' }
        description: { type: string, minLength: 1, maxLength: 1000 }
        mimeType: { type: string, minLength: 1, maxLength: 160 }
        inputSchema: { $ref: '#/components/schemas/ClosedJsonSchema' }
        outputSchema: { $ref: '#/components/schemas/ClosedJsonSchema' }
        amount: { $ref: '#/components/schemas/PositiveAtomicAmount' }
        asset: { type: string, minLength: 1, maxLength: 160 }
        network: { type: string, minLength: 1, maxLength: 80 }
        paymentProtocol: { type: string, const: x402 }
        paymentScheme: { type: string, const: exact }
        availability: { type: string, const: active }
        fulfillmentMode: { type: string, const: synchronous_https }
        fulfillmentTimeoutSeconds: { type: integer, minimum: 1, maximum: 30 }
        updatedAt: { type: string, format: date-time }
        authoritativeForPurchase: { type: boolean, const: false }
        canonicalUrl: { type: string, format: uri }
        purchaseSessionEndpoint: { type: string, format: uri }
    PublicProductDocument:
      type: object
      additionalProperties: false
      required: [schemaVersion, sellerId, sellerSlug, publicationRevision, issuedAt, expiresAt, canonicalOrigin, product]
      properties:
        schemaVersion: { type: string, const: agentpay.product-contract.v1 }
        sellerId: { type: string, pattern: '^sel_[A-Za-z0-9]+$' }
        sellerSlug: { type: string, pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$' }
        publicationRevision: { type: integer, minimum: 1 }
        issuedAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        canonicalOrigin: { type: string, format: uri }
        product: { $ref: '#/components/schemas/PublicProduct' }
    StorefrontTombstone:
      type: object
      additionalProperties: false
      required: [schemaVersion, sellerId, sellerSlug, availability, reason, publicationRevision, issuedAt, expiresAt, canonicalOrigin]
      properties:
        schemaVersion: { type: string, const: agentpay.discovery.v1 }
        sellerId: { type: string, pattern: '^sel_[A-Za-z0-9]+$' }
        sellerSlug: { type: string, pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$' }
        availability: { type: string, const: inactive }
        reason: { type: string, enum: [suspended, cancelled, closed] }
        publicationRevision: { type: integer, minimum: 1 }
        issuedAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        canonicalOrigin: { type: string, format: uri }
    DiscoverySignature:
      type: object
      additionalProperties: false
      required: [alg, kid, canonicalization, domainSeparator, value]
      properties:
        alg: { type: string, const: ES256 }
        kid: { type: string, minLength: 1, maxLength: 128 }
        canonicalization: { type: string, const: RFC8785 }
        domainSeparator: { type: string, const: agentpay.discovery.v1 }
        value: { type: string, minLength: 86, maxLength: 86, description: 'Unpadded base64url encoding of the raw 64-byte ES256 signature over agentpay.discovery.v1, one NUL byte, and RFC 8785 canonical document bytes.' }
    SignedStorefrontManifest:
      type: object
      additionalProperties: false
      required: [document, signature]
      properties:
        document: { $ref: '#/components/schemas/StorefrontManifest' }
        signature: { $ref: '#/components/schemas/DiscoverySignature' }
    SignedStorefrontTombstone:
      type: object
      additionalProperties: false
      required: [document, signature]
      properties:
        document: { $ref: '#/components/schemas/StorefrontTombstone' }
        signature: { $ref: '#/components/schemas/DiscoverySignature' }
    SignedPublicProductDocument:
      type: object
      additionalProperties: false
      required: [document, signature]
      properties:
        document: { $ref: '#/components/schemas/PublicProductDocument' }
        signature: { $ref: '#/components/schemas/ProductContractSignature' }
    ProductContractSignature:
      type: object
      additionalProperties: false
      required: [alg, kid, canonicalization, domainSeparator, value]
      properties:
        alg: { type: string, const: ES256 }
        kid: { type: string, minLength: 1, maxLength: 128 }
        canonicalization: { type: string, const: RFC8785 }
        domainSeparator: { type: string, const: agentpay.product-contract.v1 }
        value: { type: string, minLength: 86, maxLength: 86 }
    ErrorCode:
      type: string
      enum:
        - invalid_request
        - invalid_credential
        - token_expired
        - token_revoked
        - subscription_inactive
        - insufficient_scope
        - permission_denied
        - not_found
        - seller_inactive
        - route_contract_stale
        - state_conflict
        - idempotency_conflict
        - payment_required
        - payment_rejected
        - payment_authorization_expired
        - payment_signature_invalid
        - payment_wallet_mismatch
        - payment_facilitator_rejected
        - payment_replayed
        - payment_capability_unsupported
        - payment_expired
        - payment_unavailable
        - payment_outcome_unknown
        - token_replayed
        - validation_failed
        - rate_limited
        - dependency_unavailable
    Error:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message, requestId]
          properties:
            code: { $ref: '#/components/schemas/ErrorCode' }
            message: { type: string }
            requestId: { type: string }
            details: { type: object }
    PaymentRecoveryError:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message, requestId, details]
          properties:
            code: { $ref: '#/components/schemas/ErrorCode' }
            message: { type: string }
            requestId: { type: string }
            details: { $ref: '#/components/schemas/PaymentRecoveryDetails' }
    AtomicAmount: { type: string, pattern: '^[0-9]+$', example: '10000' }
    PositiveAtomicAmount: { type: string, pattern: '^[1-9][0-9]*$', example: '35000000' }
    Sha256: { type: string, pattern: '^[a-f0-9]{64}$' }
    ClosedJsonSchema:
      type: object
      description: Bounded JSON Schema whose root and every nested object schema set additionalProperties to false.
      required: [type, properties, additionalProperties]
      properties:
        type: { type: string, const: object }
        properties: { type: object }
        required:
          type: array
          uniqueItems: true
          items: { type: string }
        additionalProperties: { type: boolean, const: false }
        description: { type: string }
      additionalProperties: false
  responses:
    SellerCreated:
      description: Seller created
      content: { application/json: { schema: { $ref: '#/components/schemas/Seller' } } }
    ProxiedResponse:
      description: Successful seller response
      headers:
        X-AgentPay-Transaction-Id: { schema: { type: string } }
        PAYMENT-RESPONSE: { schema: { type: string }, description: x402 v2 settlement response when supplied by the payment adapter }
      content: { application/json: { schema: {} } }
    PaymentRequired:
      description: x402 v2 challenge or terminal authorization failure; codes are payment_required, payment_rejected, payment_authorization_expired, payment_signature_invalid, payment_wallet_mismatch, or payment_facilitator_rejected. PAYMENT-REQUIRED is present only when the same intent may be reauthorized.
      headers:
        PAYMENT-REQUIRED: { schema: { type: string }, description: Base64-encoded x402 PaymentRequired payload }
        X-AgentPay-Transaction-Id: { schema: { type: string, pattern: '^txn_[A-Za-z0-9]+$' }, description: Stable transaction identifier created before the challenge and safe to show as the buyer support trace. }
        X-AgentPay-Request-Id: { schema: { type: string, minLength: 1, maxLength: 128 }, description: Request correlation identifier available as a fallback support trace. }
        Cache-Control: { schema: { type: string, const: no-store } }
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    BadRequest: { description: 400 invalid_request, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    Unauthorized:
      description: 401 invalid_credential, token_expired, or token_revoked
      headers:
        WWW-Authenticate: { schema: { type: string } }
        Cache-Control: { schema: { type: string, const: no-store } }
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    NotFound: { description: '404 not_found, including concealed cross-tenant resources', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    Conflict: { description: '409 state_conflict, idempotency_conflict, payment_replayed, or token_replayed', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    Gone: { description: 410 expired one-time resource, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    CommerceGone: { description: '410 payment_expired or seller_inactive; payment_expired uses recoveryAction=start_new_checkout', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    SellerInactive: { description: 410 seller_inactive; known seller cannot participate in discovery or new commerce, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    Unprocessable: { description: '422 validation_failed with bounded field details, or payment_capability_unsupported with bounded recovery details', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    PaymentCapabilityUnsupported: { description: '422 payment_capability_unsupported with bounded compatibility and recovery details', content: { application/json: { schema: { $ref: '#/components/schemas/PaymentRecoveryError' } } } }
    PermissionDenied: { description: '403 subscription_inactive, insufficient_scope, or permission_denied', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    RateLimited:
      description: Caller, credential, browser session, seller quota, or public endpoint rate limit is exhausted
      headers:
        Retry-After: { schema: { type: integer, minimum: 1 } }
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    DependencyUnavailable:
      description: 503 dependency_unavailable; authoritative authorization or transaction state cannot be established
      headers:
        Retry-After: { schema: { type: integer, minimum: 1 } }
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    PaymentUnavailable:
      description: 503 payment_unavailable or payment_outcome_unknown with a bounded safe recovery action; payer inconsistency after a settled response uses await_reconciliation and must not repeat payment
      headers:
        Retry-After: { schema: { type: integer, minimum: 1 } }
      content: { application/json: { schema: { $ref: '#/components/schemas/PaymentRecoveryError' } } }
