    post:
      summary: Atomically replace and revoke a seller project credential
      description: Creates one successor, revokes the predecessor, and returns the successor secret once. Exact idempotent retries can recover the same response for ten minutes from KMS envelope-encrypted response material. A failure before commit leaves the predecessor valid; after the replay window, a lost response requires rotating the committed successor.
      tags: [Integrations]
      operationId: rotateIntegrationCredential
      security: [{ sellerBearer: [] }]
      parameters:
        - { $ref: '#/components/parameters/SellerId' }
        - { $ref: '#/components/parameters/CredentialId' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RotateIntegrationCredentialRequest' }
      responses:
        '201':
          description: Successor credential and one-time raw project key
          headers:
            Cache-Control: { schema: { type: string, const: no-store } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IntegrationCredentialRotation' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/PermissionDenied' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: State or idempotency conflict. When a committed rotation response has expired, error.details includes successorCredentialId and recoveryAction=rotate_successor; the predecessor remains revoked.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/DependencyUnavailable' }
