asyncapi: 3.1.0
info:
  title: AgentPay deferred buyer-approval events
  version: 0.3.0
  description: |
    Historical M2 contract retained as design documentation for a future
    enterprise approval capability. Buyer-side multi-person approval is
    deferred and disabled for Lean V1: no approval WebSocket server or channel
    is deployed, no invitation or approval cookie is issued, and no payment
    depends on these messages. Re-enabling this contract requires a new ADR,
    active REST contract, persistence migration, security review, and release
    task.
  x-agentpay-runtime-status: deferred-disabled
servers:
  local:
    host: localhost:8080
    protocol: ws
    pathname: /ws
    security:
      - $ref: '#/components/securitySchemes/approvalCookie'
    description: Historical endpoint shape only; not started or deployed by Lean V1.
channels:
  approvalSession:
    address: /approval-sessions/{sessionId}
    parameters:
      sessionId:
        description: Approval session identifier
    messages:
      sessionSnapshot: { $ref: '#/components/messages/SessionSnapshot' }
      approverJoined: { $ref: '#/components/messages/ApproverJoined' }
      decisionRecorded: { $ref: '#/components/messages/DecisionRecorded' }
      sessionResolved: { $ref: '#/components/messages/SessionResolved' }
operations:
  receiveApprovalEvents:
    action: receive
    channel: { $ref: '#/channels/approvalSession' }
    summary: Deferred historical stream for approval-session updates.
    description: |
      This operation is not available in Lean V1.
      Before upgrade, the server validates the cookie, session binding,
      approver binding, invitation expiry, session expiry, and exact Origin. It returns 401
      invalid_credential for a missing or invalid cookie, 403 permission_denied
      for a session mismatch, 410 invitation_expired for expired authority, 429
      rate_limited when connection limits are exceeded, and 503
      dependency_unavailable when authorization state cannot be established.
      After upgrade, authorization expiry closes the connection with code 4401;
      a session mismatch closes with 4403; normal session completion closes with
      1000. Reconnect repeats authorization and receives a full snapshot.
      A session.resolved event never contains an approval token. The buyer agent
      or browser purchase owner observes the resolved state and claims its
      short-lived token through the REST completion-token endpoint.
components:
  securitySchemes:
    approvalCookie:
      type: httpApiKey
      in: cookie
      name: __Host-agentpay_approvals
      description: Opaque browser grant set containing independently bounded approval grants established by one-time REST invitation exchanges.
  messages:
    SessionSnapshot:
      name: session.snapshot
      payload: { $ref: '#/components/schemas/EventEnvelope' }
    ApproverJoined:
      name: approver.joined
      payload: { $ref: '#/components/schemas/EventEnvelope' }
    DecisionRecorded:
      name: approval.decided
      payload: { $ref: '#/components/schemas/EventEnvelope' }
    SessionResolved:
      name: session.resolved
      payload: { $ref: '#/components/schemas/EventEnvelope' }
  schemas:
    EventEnvelope:
      type: object
      additionalProperties: false
      required: [eventId, type, sessionId, occurredAt, data]
      properties:
        eventId: { type: string }
        type: { type: string, enum: [session.snapshot, approver.joined, approval.decided, session.resolved] }
        sessionId: { type: string }
        occurredAt: { type: string, format: date-time }
        data:
          type: object
          description: Current redacted session snapshot; invitation tokens and approval tokens are never broadcast.
