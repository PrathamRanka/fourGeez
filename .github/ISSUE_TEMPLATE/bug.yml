name: Bug report
description: Report a reproducible AgentPay defect without sensitive data.
title: "bug: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Do not report vulnerabilities, credentials, wallet material, or private data here. Follow SECURITY.md.
  - type: textarea
    id: behavior
    attributes:
      label: Observed behavior
      description: Explain what happened and which surface was affected.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Provide the smallest safe reproduction with secrets removed.
    validations:
      required: true
  - type: input
    id: commit
    attributes:
      label: Commit or deployment
      placeholder: Commit SHA or non-sensitive environment name
  - type: checkboxes
    id: safety
    attributes:
      label: Safety check
      options:
        - label: I removed credentials, personal data, payment proofs, and private customer information.
          required: true
